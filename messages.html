<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PartsLister Pro Messages v365</title>
<!-- PartsLister Pro — Messages page (v321: new; v322: conversation threads — the whole back-and-forth
     with each buyer, chat style, from eBay's Message API. Offers from a conversation. The v321
     email-style view is still at /messages/classic). Nothing about your messages is saved on the server.
     v323: delete a conversation + Trash (restore from there); "AI draft" writes a reply from the
     conversation and the listing — you edit it and press Send.
     v329: "Ships to" box checks whether this listing can ship to a country (eBay checked live), and the
     AI draft uses that answer — or checks any country the buyer names on its own.
     v330: buyer messages in other languages are translated to English automatically (See original to
     switch back); a Settings link opens Settings → Messages.
     v331: when a draft offers your discount, a checked box sends that offer when you press Send.
     v336: "Waiting on me" is now your follow-up list (conversations you promised to get back to —
     added automatically when you send a draft that promises it, until you mark it complete). The old
     "Waiting on me" (buyer wrote last, no answer yet) is renamed "Needs reply".
     v337: a listing + order strip under each conversation's header: title, price + shipping, and for
     this buyer — not bought / bought / shipped with tracking / delivered.
     v339: when a draft is written in the buyer's language, the English version shows under it.
     v341: "Needs reply" skips conversations you answered last or where the buyer only said "ok thanks";
     AI draft says when there's nothing to answer instead of writing a note into the reply box.
     v355: if eBay can't send your discount offer on this listing, the draft doesn't promise one and
     the line under AI draft says why.
     v365: buyer photos open full size inside the page (click to zoom, Esc / × to close). Optional
     automatic AI draft for conversations that need a reply, and a Discard button next to Send.
     A draft you haven't sent stays put if you open another conversation and come back. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  /* Same palette as the Sales page and the listing tool */
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --accent: #f5a623;
    --accent2: #e8912a;
    --text: #e8e8e8;
    --text2: #b8b8b8;
    --muted: #888;
    --success: #4caf82;
    --danger: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px; min-height: 100vh; }

  /* HEADER — same as the Sales page */
  header {
    background: var(--surface); border-bottom: 2px solid var(--accent); padding: 0 24px;
    display: flex; align-items: center; gap: 16px; height: 56px; position: sticky; top: 0; z-index: 10;
  }
  .logo-link { text-decoration: none; color: inherit; }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
  .logo span { color: var(--accent); }
  .logo-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-top: -2px; }
  .page-tabs { display: flex; gap: 2px; margin-left: 12px; }
  .page-tabs a {
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 4px;
  }
  .page-tabs a:hover { color: var(--text); background: var(--surface2); }
  .page-tabs a[aria-current="page"] { color: #000; background: var(--accent); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px; border-radius: 4px;
    border: 1px solid transparent; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; text-decoration: none; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-secondary { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 48px; }
  .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
  .page-note { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .page-note button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  .page-note button:hover { text-decoration: underline; }
  .page-note button:disabled { color: var(--muted); cursor: default; text-decoration: none; }

  /* TILES — click a tile to open its page */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .tile {
    display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px;
    min-width: 0; color: inherit; text-decoration: none; position: relative;
  }
  a.tile { transition: border-color 0.15s; }
  a.tile:hover { border-color: var(--accent); }
  a.tile::after { content: '→'; position: absolute; top: 14px; right: 16px; color: var(--muted); font-size: 14px; }
  a.tile:hover::after { color: var(--accent); }
  .tile-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
  .tile-value { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.05; color: var(--text); white-space: nowrap; }
  .tile-value.accent { color: var(--accent); }
  .tile-sub { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.status { border-left-width: 3px; }
  .tile.status.ok { border-left-color: var(--success); }
  .tile.status.bad { border-left-color: var(--danger); background: rgba(224,82,82,0.06); }
  .tile.status.bad .tile-value { color: var(--danger); }
  .status-tag { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-left: 8px; vertical-align: 10px; }
  .tile.status.ok .status-tag { color: var(--success); }
  .tile.status.bad .status-tag { color: var(--danger); }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin: 24px 0 12px;
  }
  .soon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .soon { background: var(--surface); border: 1px dashed var(--border); border-radius: 6px; padding: 14px 16px; }
  .soon h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
  .soon p { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .error-box { background: rgba(224,82,82,0.08); border: 1px solid rgba(224,82,82,0.4); color: #f0a0a0; border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; display: none; }

  #loading { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 2px; text-transform: uppercase; }
  #loading.hidden { display: none; }

  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) {
    header { padding: 0 12px; gap: 8px; }
    .who, .header-wide { display: none !important; }
    .header-right { gap: 6px; }
    .header-right .btn-sm { padding: 5px 8px; font-size: 11px; letter-spacing: 0.5px; }
    .page-tabs { margin-left: 4px; }
    .page-tabs a { padding: 5px 7px; font-size: 13px; letter-spacing: 0.5px; }
    .page-tabs { overflow-x: auto; scrollbar-width: none; flex-shrink: 1; min-width: 0; }   /* v319: 5 tabs — slide sideways if needed */
    .page-tabs a { padding: 5px 6px; font-size: 12px; flex-shrink: 0; }
    .logo { font-size: 20px; }
    main { padding: 16px 16px 40px; }
    .grid { grid-template-columns: 1fr; }
    .tile-value { font-size: 34px; }
  }

  /* v322: MESSAGE THREADS */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px; gap: 2px; }
  .seg button {
    background: none; border: none; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; cursor: pointer;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #000; }
  .search {
    flex: 1; min-width: 220px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px;
    padding: 9px 12px; font-family: 'Barlow', sans-serif; font-size: 14px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .summary { color: var(--muted); font-size: 13px; margin-bottom: 10px; }


  .twrap { display: grid; grid-template-columns: minmax(280px, 360px) 1fr; gap: 12px; align-items: stretch; height: calc(100vh - 260px); min-height: 420px; }
  .tlist { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow-y: auto; }
  .tlist .empty { color: var(--muted); padding: 40px 12px; text-align: center; }
  .trow { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid var(--border); color: var(--text2); padding: 10px 14px; cursor: pointer; font: inherit; }
  .trow:hover { background: var(--surface2); }
  .trow.on { background: var(--surface2); box-shadow: inset 3px 0 0 var(--accent); }
  .trow .r1 { display: flex; gap: 8px; align-items: baseline; }
  .trow .tname { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .tdate { margin-left: auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .trow .badge { background: var(--accent); color: #000; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 1px 7px; }
  .trow .ttitle { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .trow .tlast { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .trow.unread .tname, .trow.unread .tlast { color: var(--text); font-weight: 700; }

  .thread { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; min-height: 0; }
  .thread .empty { color: var(--muted); margin: auto; padding: 40px; text-align: center; }
  .th-head { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .th-who { font-size: 17px; font-weight: 700; }
  .th-item { display: flex; gap: 10px; align-items: center; color: var(--text2); text-decoration: none; font-size: 13px; min-width: 0; flex: 1; }
  .th-item:hover { color: var(--accent); }
  .th-item img { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; background: var(--surface2); flex-shrink: 0; }
  .th-item span { overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .th-close { display: none; }
  .th-body { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .day { align-self: center; color: var(--muted); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; margin: 10px 0 4px; }
  .bub { max-width: 75%; padding: 8px 12px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; word-wrap: break-word; font-size: 14px; }
  .bub.them { align-self: flex-start; background: var(--surface2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .bub.me { align-self: flex-end; background: #3b2a0c; border: 1px solid #6b4b14; border-bottom-right-radius: 4px; }
  .bub .bt { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; text-align: right; white-space: nowrap; }
  .bub img { display: block; max-width: 220px; max-height: 220px; border-radius: 8px; margin-top: 6px; }
  .bub a { color: var(--accent); }
  .th-compose { border-top: 1px solid var(--border); padding: 10px 12px; display: flex; gap: 8px; align-items: flex-end; }
  .th-compose textarea { flex: 1; min-height: 44px; max-height: 180px; resize: vertical; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 18px; padding: 10px 14px; font-family: 'Barlow', sans-serif; font-size: 14px; line-height: 1.4; outline: none; }
  .th-compose textarea:focus { border-color: var(--accent); }
  /* v323: AI draft row above the reply box */
  .th-ai { border-top: 1px solid var(--border); padding: 8px 12px 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .th-ai input { flex: 1; min-width: 160px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 6px 10px; font: inherit; font-size: 13px; }
  .th-ai input:focus { border-color: var(--accent); outline: none; }
  .th-ai .aimsg { font-size: 12px; color: var(--muted); }
  /* v329: ships-to check */
  .th-ai select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 6px 8px; font: inherit; font-size: 13px; color-scheme: dark; max-width: 170px; }
  .ship-res { font-size: 12.5px; padding: 6px 12px 0; line-height: 1.45; }
  /* v330: translations */
  .bub .tr { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .bub .tr a { color: var(--accent); cursor: pointer; text-decoration: underline; }
  /* v331: discount offer box */
  .disc-row { font-size: 13px; padding: 6px 12px 0; color: var(--accent); display: none; }
  .disc-row.on { display: block; }
  .disc-row label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  /* v337: listing + order strip */
  .th-info { padding: 8px 16px; border-bottom: 1px solid var(--border); font-size: 13px; line-height: 1.55; color: var(--muted); }
  .th-info .ti-title { color: var(--text); font-weight: 600; }
  .th-info .ti-price { color: var(--accent); font-weight: 600; }
  .th-info .ti-ord { color: var(--text); }
  .th-info .ti-ord.good { color: var(--success); }
  .th-info .ti-trk { font-family: ui-monospace, Menlo, monospace; color: var(--text); user-select: all; }
  .th-info button { background: none; border: 1px solid var(--border); color: var(--accent); border-radius: 4px; font: inherit; font-size: 11px; padding: 1px 6px; cursor: pointer; margin-left: 4px; }
  /* v339: English copy of a draft written in the buyer's language */
  .en-copy { font-size: 12.5px; padding: 6px 12px 0; color: var(--muted); display: none; line-height: 1.45; }
  .en-copy.on { display: block; }
  .en-copy b { color: var(--accent); font-weight: 600; }
  /* v336: Waiting on me */
  .fu-row { font-size: 13px; padding: 6px 12px 0; color: var(--accent); display: none; }
  .fu-row.on { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .fu-row label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .fu-row input[type=text] { flex: 1; min-width: 180px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 4px 8px; font: inherit; font-size: 13px; }
  .fu-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 16px; border-bottom: 1px solid var(--border); background: rgba(240,165,0,0.08); color: var(--accent); font-size: 13px; }
  .fu-bar .fu-task { flex: 1; min-width: 160px; color: var(--text); }
  .fu-bar .fu-since { color: var(--muted); font-size: 12px; }
  .trow .tlast.fu { color: var(--accent); }
  .seg .cnt { margin-left: 4px; font-size: 11px; opacity: 0.85; }
  .ship-res.yes { color: var(--success); } .ship-res.no { color: var(--danger); } .ship-res.maybe { color: var(--accent); }
  .th-ai + .th-compose { border-top: none; }
  /* v365: photo viewer + Discard */
  .lightbox { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; overflow: auto; }
  .lightbox.on { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 92vh; object-fit: contain; cursor: zoom-in; border-radius: 4px; }
  .lightbox.zoom { align-items: flex-start; justify-content: flex-start; }
  .lightbox.zoom img { max-width: none; max-height: none; cursor: zoom-out; }
  .lightbox .lb-close { position: fixed; top: 14px; right: 18px; font-size: 30px; line-height: 1; color: #fff; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; width: 44px; height: 44px; cursor: pointer; }
  .lightbox .lb-nav { position: fixed; top: 50%; transform: translateY(-50%); font-size: 30px; color: #fff; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); border-radius: 50%; width: 44px; height: 44px; cursor: pointer; }
  .lightbox .lb-prev { left: 14px; } .lightbox .lb-next { right: 14px; }
  .lightbox .lb-count { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); color: #ddd; font-size: 13px; }
  .btn-discard { background: var(--surface2); color: var(--muted); border: 1px solid var(--border); display: none; }
  .btn-discard.on { display: inline-block; }
  .btn-danger { background: var(--surface2); color: var(--danger); border-color: rgba(224,82,82,0.5); }
  .btn-danger:hover { border-color: var(--danger); color: var(--danger); }
  .th-note { padding: 10px 16px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: var(--accent2); }

  /* offers panel */
  .offers { border-bottom: 1px solid var(--border); padding: 12px 16px; background: var(--surface2); display: none; font-size: 13px; }
  .offers.open { display: block; }
  .offers h4 { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .offers h4 + * { margin-bottom: 4px; }
  .bo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .bo:last-of-type { border-bottom: none; }
  .bo .amt { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; color: var(--accent); }
  .money-in { width: 100px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 6px 8px; font: inherit; }
  .text-in { flex: 1; min-width: 160px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 6px 8px; font: inherit; }
  .offers .help { color: var(--muted); line-height: 1.5; margin: 4px 0 8px; }
  .offers .sendrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .scope-box { background: rgba(245,166,35,0.08); border: 1px solid rgba(245,166,35,0.45); color: var(--text); border-radius: 6px; padding: 12px 14px; font-size: 13px; line-height: 1.55; margin-bottom: 12px; display: none; }
  .scope-box a { color: var(--accent); }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0b0b0b; border: 1px solid #3a3a3a; border-left: 3px solid var(--success); padding: 12px 18px; border-radius: 6px; z-index: 200; display: none; max-width: calc(100% - 32px); }
  #toast.show { display: block; }
  #toast.error { border-left-color: var(--danger); }
  @media (max-width: 800px) {
    .twrap { grid-template-columns: 1fr; height: auto; }
    .tlist { max-height: none; }
    .thread { display: none; position: fixed; inset: 0; z-index: 60; border-radius: 0; border: none; }
    .thread.open { display: flex; }
    .th-close { display: inline-flex; }
    .th-item span { display: none; }   /* phone: photo only, name stays readable */
    .th-head { flex-wrap: nowrap; }
    .bub { max-width: 85%; }
    .seg button { padding: 6px 9px; font-size: 13px; }
    .search { min-width: 0; width: 100%; flex-basis: 100%; }
  }
</style>
</head>

<header>
  <a href="/" class="logo-link" title="Home">
    <div class="logo"><span>PARTS</span>LISTER</div>
    <div class="logo-sub">PRO <span style="font-size:9px;opacity:0.6;font-weight:400;letter-spacing:0.5px;">v365</span></div>
  </a>
  <nav class="page-tabs" aria-label="Pages">

    <a href="/">Home</a>
    <a href="/sales">Sales</a>
    <a href="/listings" aria-current="page">Listings</a>
    -->
    <a href="/">Home</a>
    <a href="/sales">Sales</a>
    <a href="/orders">Orders</a>   <!-- v319 -->
    <a href="/messages" aria-current="page">Messages</a>   <!-- v321 -->
    <a href="/returns">Returns</a>   <!-- v324 -->
    <a href="/active">Active</a>

<script>
// ─── SHARED (same on Home and Listings) ─────────────────────────────────────
const EBAY_TZ = 'America/Los_Angeles';   // eBay counts days in Pacific time
const money0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const money2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
function setText(id, text) { document.getElementById(id).textContent = text; }
function ebayTodayKey() { return new Intl.DateTimeFormat('en-CA', { timeZone: EBAY_TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
function keyPlus(key, n) { const [y, m, d] = key.split('-').map(Number); const t = new Date(y, m - 1, d + n); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
function timeAgo(iso) {
  if (!iso) return 'never';
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' hr ago';
  return Math.round(hrs / 24) + ' days ago';
}
async function getJSON(url) {
  try { const r = await fetch(url); if (r.status === 401) return { _signedOut: true }; return r.ok ? await r.json() : null; }
  catch (e) { return null; }
}
async function logout() {
  await fetch('/api/logout', { method: 'POST' }).catch(() => {});
  location.href = '/sales';
}
// Not signed in → the sign-in screen on the Sales page, then back here
async function loadMe() {
  const me = await getJSON('/api/me');
  if (!me || me._signedOut) { location.href = '/sales?next=' + encodeURIComponent(location.pathname); return null; }
  setText('who', me.email + (me.isAdmin ? '  · admin' : ''));
  return me;
}

// ─── MESSAGE THREADS ─────────────────────────────────────────────────────────
// v322: conversations from eBay's Message API, chat style. Opening one marks it
// read on eBay. Replies go into the same conversation. If the conversation is
// about an item, "Offers" lets you answer the buyer's Best Offer or send an
// offer to everyone interested in the item.
let threads = [], type = 'members', show = 'all', current = null, me = null, isAdmin = false;
// v341: a buyer message that doesn't need an answer (same test as the server)
const isCloser = (text) => /^\s*(ok(ay)?|k+|kk|thanks?( you)?( so much| a lot)?|thank u|thx|ty|tysm|got it|gotcha|cool|great|perfect|awesome|sounds good|will do|no worries|no problem|np|understood|alright|all right|appreciate it|much appreciated)([\s,.!]+(ok(ay)?|thanks?( you)?|thx|ty|again|man|bro|buddy|sir|so much|a lot|appreciate it))*[\s.!,]*[\u{1F44D}\u{1F64F}\u{1F642}\u{1F60A}\u{263A}️]*\s*$/iu.test(String(text || '')) || /^\s*([\u{1F44D}\u{1F64F}\u{1F642}\u{1F60A}\u{263A}]\uFE0F?\s*)+$/u.test(String(text || ''));
const needsReply = (t) => (t.needsReply !== undefined ? t.needsReply : !t.last.mine) && !(t.last && t.last.mine);
const draftsById = {};   // v365: unsent drafts, per conversation (this page only — not saved)
const discardedIds = new Set();   // v365: you discarded the auto draft — don't write another one this visit
let followups = [];   // v336: Waiting on me — { id, conversationId, itemId, title, task, since }
const openFollowup = (convId) => followups.find(f => f.conversationId === convId) || null;
async function loadFollowups() {
  const d = await getJSON('/api/followups');
  if (d && Array.isArray(d.followups)) followups = d.followups;
  setText('fu-count', followups.length ? ' ' + followups.length : '');
}

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
let toastTimer;
function toast(msg, bad) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (bad ? ' error' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', bad ? 7000 : 4000); }
function shortDate(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  if (d.toDateString() === now.toDateString()) return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + (d.getFullYear() !== now.getFullYear() ? ', ' + d.getFullYear() : '');
}
const norm = (t) => String(t || '').toLowerCase();

function showScopeBox(on) {
  const b = document.getElementById('t-scope');
  b.style.display = on ? 'block' : 'none';
  if (!on) return;
  b.textContent = '';
  b.append(el('b', '', 'Conversations need one more eBay permission. '));
  b.append(document.createTextNode(isAdmin
    ? 'Go to ⚙ Settings → Admin and click Reconnect eBay, then approve on eBay’s screen. Your sales and orders keep working while you do. Until then, '
    : 'Ask the account admin to reconnect eBay. Until then, '));
  const a = el('a', '', 'use the classic view'); a.href = '/messages/classic';
  b.append(a, document.createTextNode('.'));
}

function renderList() {
  document.querySelectorAll('#seg-type button').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === type ? 'true' : 'false'));
  document.querySelectorAll('#seg-show button').forEach(b => b.setAttribute('aria-pressed', b.dataset.show === show ? 'true' : 'false'));
  const q = norm(document.getElementById('t-search').value).trim();
  // v336: Waiting on me also shows follow-ups whose conversation isn't in the loaded list
  const pool = show === 'followup' && type === 'members'
    ? threads.concat(followups.filter(f => !threads.some(t => t.id === f.conversationId)).map(f => ({ id: f.conversationId, other: '', title: f.title || '', itemId: f.itemId, unread: 0, last: { text: '', date: f.since } })))
    : threads;
  // const list = threads.filter(t => {
  const list = pool.filter(t => {
    if (show !== 'trash' && /DELET/i.test(t.status || '')) return false;   // v323: deleted ones only show in the Trash
    if (show === 'unread' && !t.unread) return false;
    // if (show === 'waiting' && (t.last.mine || type === 'ebay')) return false;
    // if (show === 'needs' && (t.last.mine || type === 'ebay')) return false;   // v336: renamed
    if (show === 'needs' && (type === 'ebay' || !needsReply(t))) return false;   // v341: not if you wrote last or they only said "ok thanks"
    if (show === 'followup' && (type === 'ebay' || !openFollowup(t.id))) return false;   // v336
    if (q && !norm(t.other + ' ' + t.title + ' ' + t.last.text + ' ' + (t.itemId || '')).includes(q)) return false;
    return true;
  });
  const unread = threads.reduce((s, t) => s + (t.unread ? 1 : 0), 0);
  // setText('t-summary', list.length + ' conversation' + (list.length === 1 ? '' : 's') + ' · ' + unread + ' unread');
  setText('t-summary', show === 'trash' ? list.length + ' deleted conversation' + (list.length === 1 ? '' : 's') + ' — open one to restore it'
    : list.length + ' conversation' + (list.length === 1 ? '' : 's') + ' · ' + unread + ' unread');   // v323
  const box = document.getElementById('t-list');
  box.textContent = '';
  // if (!list.length) { box.append(el('div', 'empty', threads.length ? 'No conversations match.' : 'No conversations.')); return; }
  // if (!list.length) { box.append(el('div', 'empty', show === 'trash' ? 'The Trash is empty.' : threads.length ? 'No conversations match.' : 'No conversations.')); return; }   // v323
  if (!list.length) { box.append(el('div', 'empty', show === 'trash' ? 'The Trash is empty.' : show === 'followup' ? 'Nothing waiting on you.' : threads.length ? 'No conversations match.' : 'No conversations.')); return; }   // v336
  list.forEach(t => {
    const b = el('button', 'trow' + (t.unread ? ' unread' : '') + (current === t.id ? ' on' : ''));
    b.type = 'button';
    const r1 = el('div', 'r1');
    r1.append(el('span', 'tname', t.other || '—'));
    if (t.unread) r1.append(el('span', 'badge', String(t.unread)));
    r1.append(el('span', 'tdate', shortDate(t.last.date)));
    b.append(r1);
    if (t.title) b.append(el('div', 'ttitle', t.title));
    // b.append(el('div', 'tlast', (t.last.mine ? 'You: ' : '') + t.last.text.replace(/\s+/g, ' ')));
    const fu = show === 'followup' ? openFollowup(t.id) : null;   // v336: show your to-do instead of the last message
    if (fu) b.append(el('div', 'tlast fu', '\u23f3 ' + (fu.task || 'Get back to the buyer') + ' \u00b7 since ' + shortDate(fu.since)));
    else b.append(el('div', 'tlast', (t.last.mine ? 'You: ' : '') + String(t.last.text || '').replace(/\s+/g, ' ')));
    b.addEventListener('click', () => openThread(t.id));
    box.append(b);
  });
}

async function loadList() {
  const who = await loadMe();
  if (!who) return;
  isAdmin = !!who.isAdmin;
  setText('t-note', 'Loading from eBay…');
  // const d = await getJSON('/api/threads?type=' + type);
  // const d = await getJSON('/api/threads?type=' + type + (show === 'trash' ? '&trash=1' : ''));   // v323: Trash comes from eBay's deleted folder
  const [d] = await Promise.all([getJSON('/api/threads?type=' + type + (show === 'trash' ? '&trash=1' : '')), loadFollowups()]);   // v336: + Waiting on me
  document.getElementById('loading').classList.add('hidden');
  const err = document.getElementById('t-error'); err.style.display = 'none';
  showScopeBox(false);
  if (!d) { err.textContent = 'Could not reach the server.'; err.style.display = 'block'; return; }
  if (!d.connected) { setText('t-note', 'eBay isn’t connected yet' + (isAdmin ? ' — connect it in Settings → Admin.' : '.')); threads = []; renderList(); return; }
  if (d.needScope) { setText('t-note', ' '); showScopeBox(true); threads = []; renderList(); return; }
  if (d.error) { err.textContent = d.error; err.style.display = 'block'; }
  me = d.me || me;
  threads = d.threads || [];
  setText('t-note', 'From eBay · checked ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' · ');
  const r = el('button', '', 'Refresh'); r.type = 'button'; r.onclick = loadList;
  document.getElementById('t-note').append(r);
  renderList();
  const hm = /^#c=(.+)$/.exec(location.hash);
  if (hm && current !== decodeURIComponent(hm[1])) showThread(decodeURIComponent(hm[1]));
}

// Phones: the conversation opens full screen and Back closes it
const phone = () => window.matchMedia('(max-width: 800px)').matches;
function openThread(id) { if (phone()) { const h = '#c=' + encodeURIComponent(id); if (location.hash !== h) location.hash = h; else showThread(id); } else showThread(id); }
function closeThread() { if (location.hash.startsWith('#c=')) history.back(); else hideThread(); }
function hideThread() { document.getElementById('t-view').classList.remove('open'); document.body.style.overflow = ''; }
window.addEventListener('hashchange', () => { const m = /^#c=(.+)$/.exec(location.hash); if (m) showThread(decodeURIComponent(m[1])); else hideThread(); });

function bubble(m) {
  const b = el('div', 'bub ' + (m.mine ? 'me' : 'them'));
  // b.append(document.createTextNode(m.text || ''));
  b.append(el('span', 'btext', m.text || ''));   // v330: in its own span so a translation can swap in
  if (m.id) b.dataset.mid = m.id;
  (m.media || []).forEach(x => {
    // if (x.type === 'IMAGE') { const a = el('a'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; const im = el('img'); im.src = x.url; im.alt = x.name || 'Photo'; a.append(im); b.append(a); }
    if (x.type === 'IMAGE') { const a = el('a'); a.href = x.url; a.dataset.full = fullSize(x.url); a.className = 'photo-link'; const im = el('img'); im.src = x.url; im.alt = x.name || 'Photo'; a.append(im); b.append(a);
      a.addEventListener('click', (e) => { e.preventDefault(); openLightbox(a); }); }   // v365: opens here, full size
    else { const a = el('a', '', '\n' + (x.name || 'Attachment')); a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; b.append(a); }
  });
  b.append(el('span', 'bt', m.date ? new Date(m.date).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''));
  return b;
}

async function showThread(id) {
  current = id;
  // const t = threads.find(x => x.id === id) || { id, other: '', title: '', itemId: null, unread: 0, last: {} };
  const f0 = openFollowup(id);   // v336: a Waiting-on-me conversation that isn't in the loaded list
  const t = threads.find(x => x.id === id) || { id, other: '', title: (f0 && f0.title) || '', itemId: (f0 && f0.itemId) || null, unread: 0, last: {} };
  const v = document.getElementById('t-view');
  if (phone()) { v.classList.add('open'); document.body.style.overflow = 'hidden'; }
  v.textContent = '';
  // header
  const head = el('div', 'th-head');
  const close = el('button', 'btn btn-secondary btn-sm th-close', '← Back'); close.type = 'button'; close.onclick = closeThread;
  head.append(close, el('div', 'th-who', t.other || 'Conversation'));
  if (t.itemId) {
    const a = el('a', 'th-item'); a.href = 'https://www.ebay.com/itm/' + encodeURIComponent(t.itemId); a.target = '_blank'; a.rel = 'noopener';
    // const im = el('img'); im.alt = ''; a.append(im, el('span', '', t.title || ('Item #' + t.itemId)));
    const im = el('img'); im.alt = ''; var headTitle = el('span', '', t.title || ('Item #' + t.itemId)); a.append(im, headTitle);   // v337: filled in from the strip
    head.append(a);
    getJSON('/api/items/thumbs?ids=' + encodeURIComponent(t.itemId)).then(x => { const u = x && x.thumbs && x.thumbs[t.itemId]; if (u) im.src = u; });
    if (type === 'members') {
      const ob = el('button', 'btn btn-secondary btn-sm', 'Offers'); ob.type = 'button';
      ob.onclick = () => toggleOffers(t);
      head.append(ob);
    }
  } else if (t.title) head.append(el('div', 'th-item', t.title));
  // v323: delete (to the Trash) or, in the Trash, restore
  const inTrash = show === 'trash';
  const del = el('button', 'btn btn-sm ' + (inTrash ? 'btn-secondary' : 'btn-danger'), inTrash ? 'Restore' : '🗑 Delete'); del.type = 'button';
  del.title = inTrash ? 'Put it back with your other conversations' : 'Move to the Trash (you can restore it)';
  del.onclick = () => setStatus(t, inTrash ? 'restore' : 'delete');
  head.append(del);
  const offers = el('div', 'offers'); offers.id = 't-offers';
  const body = el('div', 'th-body'); body.append(el('div', 'empty', 'Loading the conversation from eBay…'));
  // v336: Waiting on me bar — your to-do for this conversation + Mark complete
  const fuBar = el('div', 'fu-bar'); fuBar.style.display = 'none';
  const drawFuBar = () => {
    const f = openFollowup(id);
    fuBar.textContent = '';
    if (!f || type === 'ebay' || inTrash) { fuBar.style.display = 'none'; return; }
    fuBar.style.display = 'flex';
    fuBar.append(el('span', '', '\u23f3 Waiting on me:'), el('span', 'fu-task', f.task || 'Get back to the buyer'), el('span', 'fu-since', 'since ' + shortDate(f.since)));
    const done = el('button', 'btn btn-secondary btn-sm', '\u2713 Mark complete'); done.type = 'button';
    done.onclick = async () => {
      done.disabled = true;
      try {
        const r = await fetch('/api/followups/' + f.id + '/done', { method: 'POST' });
        if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not mark it complete');
        followups = followups.filter(x => x.id !== f.id); setText('fu-count', followups.length ? ' ' + followups.length : '');
        drawFuBar(); renderList(); toast('Marked complete.');
      } catch (e) { done.disabled = false; toast(e.message, true); }
    };
    fuBar.append(done);
  };
  drawFuBar();
  // v.append(head, offers, body);
  // v.append(head, fuBar, offers, body);   // v336: + Waiting on me bar
  // v337: listing + order strip
  const info = el('div', 'th-info'); info.style.display = 'none';
  if (t.itemId && type === 'members') { info.style.display = 'block'; info.textContent = 'Loading the listing and order…'; loadInfo(t, id, info, typeof headTitle !== 'undefined' ? headTitle : null); }
  v.append(head, info, fuBar, offers, body);
  renderList();
  const d = await getJSON('/api/threads/' + encodeURIComponent(id) + '?type=' + type + (t.unread ? '&markRead=1' : ''));
  if (current !== id) return;
  body.textContent = '';
  if (!d || d.error || d.needScope) { body.append(el('div', 'empty', (d && d.error) || 'Could not load that conversation.')); return; }
  if (t.unread) { t.unread = 0; renderList(); }
  // v341: eBay's list can lag behind — use the newest message we just loaded
  const newest = (d.messages || []).slice().sort((x, y) => String(x.date).localeCompare(String(y.date))).pop();
  if (newest && t.last) { t.last = { text: newest.text || '', date: newest.date, mine: !!newest.mine }; t.needsReply = !newest.mine && !isCloser(newest.text); renderList(); }
  let lastDay = '';
  (d.messages || []).forEach(m => {
    const day = m.date ? new Date(m.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : '';
    if (day !== lastDay) { body.append(el('div', 'day', day)); lastDay = day; }
    body.append(bubble(m));
  });
  if (!(d.messages || []).length) body.append(el('div', 'empty', 'No messages in this conversation.'));
  body.scrollTop = body.scrollHeight;
  translateThread(id, body, d.messages || []);   // v330: only if Auto-translate is on (Settings → Messages)
  // compose — buyers only (eBay's own messages can't be answered)
  if (type === 'ebay') { v.append(el('div', 'th-note', 'Messages from eBay can’t be answered.')); return; }
  if (inTrash) { v.append(el('div', 'th-note', 'This conversation is in the Trash. Restore it to reply.')); return; }   // v323
  const comp = el('div', 'th-compose');
  const ta = el('textarea'); ta.placeholder = 'Message ' + (t.other || 'buyer') + '…'; ta.maxLength = 2000; ta.rows = 1;
  const send = el('button', 'btn btn-primary btn-sm', 'Send'); send.type = 'button';
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send.click(); } });
  send.onclick = async () => {
    const text = ta.value.trim();
    if (!text) return;
    send.disabled = true; send.textContent = 'Sending…';
    try {
      // v331: send the discount offer first (if the box is ticked) — if eBay refuses it, the message isn't sent
      if (pendingOffer && discBox.checked) {
        const ro = await fetch('/api/offers/' + encodeURIComponent(t.itemId) + '/send', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ price: pendingOffer.offerPrice, message: '' }) });
        const oo = await ro.json().catch(() => ({}));
        if (!ro.ok) throw new Error((oo.error || 'eBay didn\u2019t send the offer') + ' — your message was NOT sent. Untick "send the offer" and edit the message if you want to send it anyway.');
        toast('Offer for ' + money2.format(pendingOffer.offerPrice) + ' sent to interested buyers.');
        pendingOffer = null; discRow.classList.remove('on');
      }
      const r = await fetch('/api/threads/' + encodeURIComponent(id) + '/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || 'Not sent');
      ta.value = ''; syncDiscard();   // v365
      const m = (out.message) || { text, date: new Date().toISOString(), mine: true };
      m.mine = true;
      if (body.querySelector('.empty')) body.textContent = '';
      body.append(bubble(m)); body.scrollTop = body.scrollHeight;
      t.last = { text: m.text, date: m.date, mine: true }; renderList();
      // v336: the reply promised a follow-up → Waiting on me (unless you unticked it)
      if (fuRow.classList.contains('on') && fuBox.checked) {
        const rf = await fetch('/api/followups', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ conversationId: id, itemId: t.itemId, title: t.title, task: fuTask.value }) });
        if (rf.ok) { await loadFollowups(); drawFuBar(); renderList(); toast('Sent — added to Waiting on me.'); }
        else toast('Sent, but it couldn\u2019t be added to Waiting on me.', true);
      }
      fuRow.classList.remove('on');
    } catch (e) { toast(e.message, true); }
    finally { send.disabled = false; send.textContent = 'Send'; }
  };
  // v365: Discard (next to Send) — clears the draft and the offer / Waiting-on-me boxes
  const discard = el('button', 'btn btn-sm btn-discard', 'Discard'); discard.type = 'button'; discard.title = 'Throw this draft away';
  const syncDiscard = () => { discard.classList.toggle('on', !!ta.value.trim()); if (ta.value.trim()) draftsById[id] = ta.value; else delete draftsById[id]; };
  ta.addEventListener('input', syncDiscard);
  discard.onclick = () => {
    ta.value = ''; ta.style.height = ''; syncDiscard(); discardedIds.add(id);
    pendingOffer = null; discRow.classList.remove('on'); fuRow.classList.remove('on'); enCopy.classList.remove('on'); aiMsg.textContent = 'Draft discarded.';
    ta.focus();
  };
  // comp.append(ta, send);
  comp.append(ta, discard, send);   // v365
  // v323: AI draft — reads this conversation + the listing, fills the reply box. Nothing is sent until you press Send.
  const ai = el('div', 'th-ai');
  const aiBtn = el('button', 'btn btn-secondary btn-sm', 'AI draft'); aiBtn.type = 'button';
  aiBtn.title = 'Draft a reply from this conversation and the listing';
  const hint = el('input'); hint.placeholder = 'Tell the AI anything (optional) — e.g. "lowest I’ll take is $150"'; hint.maxLength = 500;
  const aiMsg = el('span', 'aimsg', '');
  aiBtn.onclick = async () => {
    if (ta.value.trim() && !confirm('Replace what you’ve typed with an AI draft?')) return;
    aiBtn.disabled = true; aiBtn.textContent = 'Drafting…'; aiMsg.textContent = t.itemId ? 'Reading the conversation and the listing…' : 'Reading the conversation…';
    try {
      const r = await fetch('/api/threads/' + encodeURIComponent(id) + '/draft', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ itemId: t.itemId, hint: hint.value, country: shipSel.value || undefined }) });   // v329: + country
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || 'No draft');
      if (current !== id) return;
      if (out.noReply) { aiMsg.textContent = out.reason || 'Nothing to answer.'; return; }   // v341: nothing to answer — leave the box alone
      ta.value = out.draft; ta.focus(); syncDiscard();   // v365
      ta.style.height = Math.min(180, ta.scrollHeight + 2) + 'px';   // grow to fit the draft
      // aiMsg.textContent = 'Draft ready — check it, edit if needed, then Send.';
      const sc = (out.shipChecks || []).map(x => x.country + ': ' + ({ yes: 'ships', no: 'can\u2019t ship', probably: 'probably ships', unknown: 'unclear' }[x.verdict])).join(', ');
      aiMsg.textContent = 'Draft ready — check it, edit if needed, then Send.' + (sc ? ' (Checked shipping — ' + sc + ')' : '');   // v329
      if (out.discountSkipped) aiMsg.textContent += ' (No discount offer: ' + out.discountSkipped + '.)';   // v355
      // v330: show what the AI was told about the sale + return window (hover for all of it)
      const rw = /Return window: (INSIDE|ENDED)[^(]*/.exec(out.orderFacts || '');
      if (rw) aiMsg.textContent += ' (Return window: ' + rw[0].replace('Return window: ', '').replace(/ counting.*$/, '').trim() + ')';
      aiMsg.title = out.orderFacts || 'No order found for this item';
      // v331: the draft offers your discount → tick box to send that offer on Send
      if (out.discount) {
        pendingOffer = out.discount; discBox.checked = true;
        discText.textContent = 'Also send the offer for ' + money2.format(out.discount.offerPrice) + ' (' + out.discount.percent + '% off ' + money2.format(out.discount.price) + ') when I press Send';
        discRow.classList.add('on');
      } else { pendingOffer = null; discRow.classList.remove('on'); }
      // v336: the draft promises a follow-up → ticked box to add it to Waiting on me when you press Send
      if (out.followUp) { fuBox.checked = true; fuTask.value = out.followUp; fuRow.classList.add('on'); }
      else fuRow.classList.remove('on');
      // v339: draft in the buyer's language → show the English
      enCopy.textContent = '';
      if (out.english) { enCopy.append(el('b', '', 'In English: '), document.createTextNode(out.english)); enCopy.classList.add('on'); }
      else enCopy.classList.remove('on');
    } catch (e) { aiMsg.textContent = ''; toast(e.message, true); }
    finally { aiBtn.disabled = false; aiBtn.textContent = 'AI draft'; }
  };
  hint.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); aiBtn.click(); } });
  // ai.append(aiBtn, hint, aiMsg);
  // v329: Ships-to box — pick a country to check this listing; AI draft then uses that answer
  const shipSel = el('select'); shipSel.title = 'Can this item ship to…? (checked with eBay)';
  shipSel.append(new Option('Ships to…?', ''));
  const shipRes = el('div', 'ship-res');
  // v331: "also send the offer" box — shown only when a draft offers your discount
  let pendingOffer = null;
  const discRow = el('div', 'disc-row');
  const discBox = el('input'); discBox.type = 'checkbox'; discBox.checked = true;
  const discLabel = el('label'); const discText = el('span', '', '');
  discLabel.append(discBox, discText); discRow.append(discLabel);
  // v336: "add to Waiting on me" box — shown when a draft promises to get back to the buyer
  const fuRow = el('div', 'fu-row');
  const fuBox = el('input'); fuBox.type = 'checkbox'; fuBox.checked = true;
  const fuLabel = el('label'); fuLabel.append(fuBox, document.createTextNode('Add to Waiting on me when I press Send:'));
  const fuTask = el('input'); fuTask.type = 'text'; fuTask.maxLength = 200; fuTask.title = 'Your to-do (edit it if you like)';
  fuRow.append(fuLabel, fuTask);
  const enCopy = el('div', 'en-copy');   // v339
  if (t.itemId) {
    loadCountries().then(list => list.forEach(c => shipSel.append(new Option(c.name, c.code))));
    shipSel.onchange = async () => {
      shipRes.className = 'ship-res'; shipRes.textContent = '';
      if (!shipSel.value) return;
      shipRes.textContent = 'Checking with eBay…';
      const d = await getJSON('/api/shipcheck/' + encodeURIComponent(t.itemId) + '?country=' + shipSel.value);
      if (current !== id) return;
      if (!d || d.error) { shipRes.textContent = (d && d.error) || 'Couldn\u2019t check.'; return; }
      const word = { yes: 'Yes — ships to ', no: 'No — eBay won\u2019t let it ship to ', probably: 'Probably ships to ', unknown: 'Couldn\u2019t tell for ' }[d.verdict] + d.country;
      const cost = d.options.filter(o => o.cost !== null).map(o => o.service + ' ' + money2.format(o.cost)).join(', ');
      shipRes.className = 'ship-res ' + (d.verdict === 'yes' ? 'yes' : d.verdict === 'no' ? 'no' : 'maybe');
      shipRes.textContent = word + (cost ? ' (' + cost + ')' : '') + '. ' + d.how.join('; ') + '. AI draft will use this.';
    };
  } else shipSel.disabled = true;
  ai.append(aiBtn, shipSel, hint, aiMsg);
  // v.append(ai, shipRes);
  // v.append(ai, shipRes, discRow);   // v331: + discount offer box
  // v.append(ai, shipRes, discRow, fuRow);   // v336: + Waiting on me box
  v.append(ai, shipRes, enCopy, discRow, fuRow);   // v339: + English copy
  v.append(comp);
  if (!phone()) ta.focus();
  // v365: a draft you started here earlier comes back; otherwise maybe write one automatically
  if (draftsById[id]) { ta.value = draftsById[id]; syncDiscard(); ta.style.height = Math.min(180, ta.scrollHeight + 2) + 'px'; }
  else if (type === 'members' && !inTrash && needsReply(t) && !discardedIds.has(id)) {
    msgPrefs().then(p => { if (p && p.autoDraft && current === id && !ta.value.trim()) { aiMsg.textContent = 'Writing a draft automatically…'; aiBtn.click(); } });
  }
}

// ─── v365: FULL-SIZE PHOTO VIEWER ────────────────────────────────────────────
// eBay picture links usually end in a size like s-l500.jpg — s-l1600 is the largest eBay serves.
function fullSize(u) { return String(u || '').replace(/\/s-l\d+\.(jpg|jpeg|png|webp)/i, '/s-l1600.$1'); }
let lbList = [], lbIdx = 0;
function openLightbox(a) {
  const bub = a.closest('.th-body') || document;
  lbList = [...bub.querySelectorAll('a.photo-link')];
  lbIdx = Math.max(0, lbList.indexOf(a));
  showLightbox();
}
function showLightbox() {
  const lb = document.getElementById('lightbox'), img = lb.querySelector('img');
  const a = lbList[lbIdx]; if (!a) return;
  lb.classList.remove('zoom');
  img.onerror = () => { if (img.src !== a.href) img.src = a.href; };   // the bigger size isn't there — use the original link
  img.src = a.dataset.full || a.href;
  lb.querySelector('.lb-count').textContent = lbList.length > 1 ? (lbIdx + 1) + ' of ' + lbList.length : '';
  lb.querySelectorAll('.lb-nav').forEach(n => { n.style.display = lbList.length > 1 ? '' : 'none'; });
  lb.classList.add('on');
}
function closeLightbox() { document.getElementById('lightbox').classList.remove('on', 'zoom'); }
(() => {
  const lb = document.getElementById('lightbox');
  lb.querySelector('.lb-close').onclick = closeLightbox;
  lb.querySelector('.lb-prev').onclick = (e) => { e.stopPropagation(); lbIdx = (lbIdx - 1 + lbList.length) % lbList.length; showLightbox(); };
  lb.querySelector('.lb-next').onclick = (e) => { e.stopPropagation(); lbIdx = (lbIdx + 1) % lbList.length; showLightbox(); };
  lb.querySelector('img').onclick = (e) => { e.stopPropagation(); lb.classList.toggle('zoom'); };   // click: actual size
  lb.addEventListener('click', (e) => { if (e.target === lb) closeLightbox(); });
  document.addEventListener('keydown', (e) => {
    if (!lb.classList.contains('on')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft' && lbList.length > 1) lb.querySelector('.lb-prev').click();
    if (e.key === 'ArrowRight' && lbList.length > 1) lb.querySelector('.lb-next').click();
  });
})();

// ─── v337: LISTING + ORDER STRIP ─────────────────────────────────────────────
const fmtDay = (iso) => iso ? new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) : '';
async function loadInfo(t, id, box, headTitle) {
  const d = await getJSON('/api/threads/' + encodeURIComponent(id) + '/info?itemId=' + encodeURIComponent(t.itemId) + '&buyer=' + encodeURIComponent(t.other || ''));
  if (current !== id) return;
  box.textContent = '';
  if (!d || d.error) { box.textContent = (d && d.error) || 'Couldn\u2019t load the listing info.'; return; }
  if (d.title && headTitle) headTitle.textContent = d.title;
  // line 1: listing
  const l1 = el('div');
  if (d.title) l1.append(el('span', 'ti-title', d.title), document.createTextNode(' \u00b7 '));
  if (d.price !== null) l1.append(el('span', 'ti-price', money2.format(d.price)));
  const sh = d.shipping;
  l1.append(document.createTextNode(!sh ? '' : sh.free ? ' + free shipping' : sh.calculated ? ' + calculated shipping' : sh.cost !== null ? ' + ' + money2.format(sh.cost) + ' shipping' : ''));
  if (sh && !sh.free && !sh.calculated && sh.cost !== null && d.price !== null) l1.append(document.createTextNode(' = ' + money2.format(d.price + sh.cost)));
  if (d.listingStatus) l1.append(document.createTextNode(' \u00b7 listing ' + (d.listingStatus === 'Active' ? 'active' : d.listingStatus === 'Completed' || d.listingStatus === 'Ended' ? 'ended' : d.listingStatus.toLowerCase())));
  box.append(l1);
  // line 2: this buyer's order
  const o = d.order || { status: 'not_bought' };
  const l2 = el('div');
  const who = t.other || 'This buyer';
  if (o.status === 'not_bought') l2.append(el('span', 'ti-ord', who + ' hasn\u2019t bought it'));
  else if (o.status === 'other_buyer') l2.append(el('span', 'ti-ord', who + ' hasn\u2019t bought it \u2014 it sold to a different buyer'));
  else {
    const head2 = { cancelled: '\u2716 Cancelled / refunded', bought: '\u2713 Bought \u00b7 not shipped yet', shipped: '\ud83d\ude9a Shipped', delivered: '\ud83d\udce6 Delivered' }[o.status] || o.status;
    l2.append(el('span', 'ti-ord' + (o.status === 'delivered' || o.status === 'shipped' ? ' good' : ''), head2));
    const bits = [];
    if (o.delivered) bits.push(fmtDay(o.delivered));
    else if (o.shipped) bits.push(fmtDay(o.shipped) + (o.expected ? ' \u00b7 expected by ' + fmtDay(o.expected) : ''));
    bits.push('bought ' + fmtDay(o.sold));
    if (o.total !== null) bits.push(money2.format(o.total));
    bits.push('order ' + o.orderId);
    l2.append(document.createTextNode(' \u00b7 ' + bits.join(' \u00b7 ')));
    (o.tracks || []).forEach(tr => {
      l2.append(document.createTextNode(' \u00b7 ' + (tr.carrier ? tr.carrier + ' ' : '')));
      l2.append(el('span', 'ti-trk', tr.number));
      const c = el('button', '', 'Copy'); c.type = 'button';
      c.onclick = () => { navigator.clipboard.writeText(tr.number).then(() => toast('Tracking number copied.'), () => toast('Couldn\u2019t copy.', true)); };
      l2.append(c);
    });
    if ((o.status === 'shipped' || o.status === 'delivered') && !(o.tracks || []).length) l2.append(document.createTextNode(o.shipError ? ' \u00b7 tracking couldn\u2019t be loaded' : ' \u00b7 no tracking number'));
  }
  box.append(l2);
}

// ─── v330: AUTO-TRANSLATE ────────────────────────────────────────────────────
let msgPrefsP = null;
function msgPrefs() { if (!msgPrefsP) msgPrefsP = getJSON('/api/msg-settings').then(d => d || {}); return msgPrefsP; }
async function translateThread(id, body, messages) {
  const prefs = await msgPrefs();
  if (prefs.autoTranslate === false) return;
  const theirs = messages.filter(m => !m.mine && m.id && m.text).map(m => ({ id: m.id, text: m.text }));
  if (!theirs.length) return;
  const r = await fetch('/api/threads/' + encodeURIComponent(id) + '/translate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ messages: theirs }) })
    .then(x => x.json()).catch(() => null);
  if (!r || current !== id) return;
  if (r.error) toast(r.error, true);
  Object.entries(r.translations || {}).forEach(([mid, t]) => {
    const b = body.querySelector('.bub[data-mid="' + CSS.escape(mid) + '"]');
    if (!b) return;
    const span = b.querySelector('.btext');
    const original = span.textContent;
    let showingOriginal = false;
    span.textContent = t.english;
    const note = el('span', 'tr');
    const link = el('a', '', 'See original');
    note.append(document.createTextNode('Translated from ' + t.lang + ' · '), link);
    link.onclick = () => { showingOriginal = !showingOriginal; span.textContent = showingOriginal ? original : t.english; link.textContent = showingOriginal ? 'See English' : 'See original'; };
    b.insertBefore(note, b.querySelector('.bt'));
  });
}

// v329: country list for the Ships-to box (asked once)
let countriesP = null;
function loadCountries() {
  if (!countriesP) countriesP = getJSON('/api/shipcheck/countries').then(d => (d && d.countries) || []);
  return countriesP;
}

// ─── v323: DELETE / RESTORE ──────────────────────────────────────────────────
async function setStatus(t, action) {
  if (action === 'delete' && !confirm('Move the conversation with ' + (t.other || 'this buyer') + ' to the Trash? You can restore it later.')) return;
  try {
    const r = await fetch('/api/threads/' + encodeURIComponent(t.id) + '/status', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type, action }) });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(out.error || 'eBay said no');
    threads = threads.filter(x => x.id !== t.id);
    current = null;
    if (phone()) closeThread();
    document.getElementById('t-view').innerHTML = '<div class="empty">Pick a conversation.</div>';
    renderList();
    toast(action === 'delete' ? 'Moved to the Trash.' : 'Restored.');
  } catch (e) { toast(e.message, true); }
}

// ─── OFFERS ──────────────────────────────────────────────────────────────────
async function toggleOffers(t) {
  const box = document.getElementById('t-offers');
  if (box.classList.contains('open')) { box.classList.remove('open'); return; }
  box.classList.add('open');
  box.textContent = 'Checking offers on eBay…';
  const d = await getJSON('/api/offers/' + encodeURIComponent(t.itemId));
  box.textContent = '';
  if (!d || d.error) { box.append(el('div', 'help', (d && d.error) || 'Could not load offers.')); return; }

  // 1) Best Offers buyers sent on this item
  box.append(el('h4', '', 'Best Offers on this item'));
  if (d.bestError) box.append(el('div', 'help', 'eBay: ' + d.bestError));
  else if (!d.bestOffers.length) box.append(el('div', 'help', 'No open Best Offers right now.'));
  d.bestOffers.forEach(o => {
    const row = el('div', 'bo');
    row.append(el('span', 'amt', money2.format(o.price || 0)), el('span', '', 'from ' + (o.buyer || 'buyer') + (o.qty > 1 ? ' · qty ' + o.qty : '') + (o.expires ? ' · expires ' + shortDate(o.expires) : '')));
    if (o.buyer && t.other && o.buyer === t.other) row.append(el('b', '', '(this buyer)'));
    if (o.message) row.append(el('span', '', '“' + o.message + '”'));
    const price = el('input', 'money-in'); price.type = 'number'; price.min = '1'; price.step = '0.01'; price.placeholder = 'Counter $';
    const acc = el('button', 'btn btn-primary btn-sm', 'Accept'); acc.type = 'button';
    const ctr = el('button', 'btn btn-secondary btn-sm', 'Counter'); ctr.type = 'button';
    const dec = el('button', 'btn btn-secondary btn-sm', 'Decline'); dec.type = 'button';
    const go = async (action) => {
      const body = { bestOfferId: o.id, action };
      if (action === 'counter') { body.price = parseFloat(price.value); if (!(body.price > 0)) { toast('Type your counter price first.', true); return; } }
      const what = action === 'accept' ? 'Accept ' + money2.format(o.price) : action === 'counter' ? 'Counter at ' + money2.format(body.price) : 'Decline ' + money2.format(o.price);
      if (!confirm(what + ' from ' + (o.buyer || 'this buyer') + '?')) return;
      const r = await fetch('/api/offers/' + encodeURIComponent(t.itemId) + '/respond', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) { toast(out.error || 'eBay said no.', true); return; }
      toast(action === 'accept' ? 'Offer accepted.' : action === 'counter' ? 'Counter-offer sent.' : 'Offer declined.');
      box.classList.remove('open'); toggleOffers(t);
    };
    acc.onclick = () => go('accept'); ctr.onclick = () => go('counter'); dec.onclick = () => go('decline');
    row.append(acc, price, ctr, dec);
    box.append(row);
  });

  // 2) Send an offer to everyone interested
  box.append(el('h4', '', 'Send an offer'));
  if (d.sendError === 'needScope') {
    box.append(el('div', 'help', isAdmin ? 'Needs the "Send offers to buyers" permission — ⚙ Settings → Admin → Reconnect eBay.' : 'Needs a new eBay permission — ask the account admin to reconnect eBay.'));
    return;
  }
  if (d.sendError) { box.append(el('div', 'help', 'eBay: ' + d.sendError)); return; }
  box.append(el('div', 'help', 'eBay sends this to everyone who is watching this item or has it in their cart — apps can’t pick one buyer. If ' + (t.other || 'this buyer') + ' is watching it, they’ll get it. Good for 2 days.'));
  if (!d.interested) { box.append(el('div', 'help', 'Right now nobody is watching this item, so eBay won’t send an offer. Ask the buyer to tap Watch, then try again — or just tell them your price in a message.')); return; }
  const row = el('div', 'sendrow');
  const p = el('input', 'money-in'); p.type = 'number'; p.min = '1'; p.step = '0.01'; p.placeholder = 'Price $';
  const msg = el('input', 'text-in'); msg.placeholder = 'Note with the offer (optional)'; msg.maxLength = 2000;
  const sb = el('button', 'btn btn-primary btn-sm', 'Send offer'); sb.type = 'button';
  sb.onclick = async () => {
    const price = parseFloat(p.value);
    if (!(price > 0)) { toast('Type the offer price first.', true); return; }
    if (!confirm('Send an offer of ' + money2.format(price) + ' to everyone interested in this item? It lasts 2 days.')) return;
    sb.disabled = true;
    try {
      const r = await fetch('/api/offers/' + encodeURIComponent(t.itemId) + '/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ price, message: msg.value }) });
      const out = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(out.error || 'Not sent');
      toast('Offer sent' + (out.sent ? ' to ' + out.sent + ' interested buyer' + (out.sent === 1 ? '' : 's') : '') + '.');
      p.value = ''; msg.value = '';
    } catch (e) { toast(e.message, true); }
    finally { sb.disabled = false; }
  };
  row.append(p, msg, sb);
  box.append(row);
}

document.querySelectorAll('#seg-type button').forEach(b => b.addEventListener('click', () => { type = b.dataset.type; current = null; document.getElementById('t-view').innerHTML = '<div class="empty">Pick a conversation.</div>'; loadList(); }));
// document.querySelectorAll('#seg-show button').forEach(b => b.addEventListener('click', () => { show = b.dataset.show; renderList(); }));
// v323: switching into or out of the Trash loads a different list from eBay
document.querySelectorAll('#seg-show button').forEach(b => b.addEventListener('click', () => {
  const wasTrash = show === 'trash';
  show = b.dataset.show;
  if (wasTrash !== (show === 'trash')) { current = null; document.getElementById('t-view').innerHTML = '<div class="empty">Pick a conversation.</div>'; loadList(); }
  else renderList();
}));
let st; document.getElementById('t-search').addEventListener('input', () => { clearTimeout(st); st = setTimeout(renderList, 120); });
loadList();
setInterval(() => { if (!document.hidden && !document.querySelector('.th-compose textarea:focus') && !document.querySelector('.offers.open')) loadList(); }, 3 * 60000);
