<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PartsLister Pro Returns v382</title>
<!-- v382: switching views is instant; browser reload / Refresh really reloads. v381: no sign-in flash; the other pages load in the background. v380: comes back instantly — shows what this page loaded last time, then quietly updates from eBay (kept in this browser tab only). -->
<!-- PartsLister Pro — Returns page (v324: new). Returns, "item not received" claims and cases from
     eBay's Post-Order API, read live (nothing saved on the server). Approve / decline / refund from here.
     v325: "Open on eBay" uses the link eBay gives for that return's current stage.
     v369: each return's live stage is checked with eBay first. Approve / Decline / partial refund show
           only while eBay allows them (new requests); Refund shows when eBay allows it and sends
           eBay's own refund breakdown (item price, shipping…), shown before you confirm.
     v370: Money section — from eBay's Payments records for the order: after a refund, what the
           buyer got back, the fee credit eBay gave you, and what it cost you; before a refund,
           an "about" cost next to the Refund button.
     v371: Late returns — returns you agreed to take after eBay's window closed (added when you send
           your return address in Messages, or by hand). Address sent → Mark received → refund on
           eBay (picked up automatically). Not received in 30 days → it drops off.
     v372: Late returns is its own button (All · Returns · Late returns · Not received · Cases) with
           its count, and lists like the others. Refunded ones are under Closed.
     v373: + Cancellations (approve / decline) and Disputes (payment disputes — needs the "Payment
           disputes" permission). Smaller stage buttons under Returns (Needs attention, Requested,
           Waiting for buyer to ship, Shipped, Delivered) and Disputes (Needs your response, Awaiting
           decision). Counts on the buttons. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  /* Same palette as the Sales page and the listing tool */
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --accent: #f5a623;
    --accent2: #e8912a;
    --text: #e8e8e8;
    --text2: #b8b8b8;
    --muted: #888;
    --success: #4caf82;
    --danger: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px; min-height: 100vh; }

  /* HEADER — same as the Sales page */
  header {
    background: var(--surface); border-bottom: 2px solid var(--accent); padding: 0 24px;
    display: flex; align-items: center; gap: 16px; height: 56px; position: sticky; top: 0; z-index: 10;
  }
  .logo-link { text-decoration: none; color: inherit; }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
  .logo span { color: var(--accent); }
  .logo-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-top: -2px; }
  .page-tabs { display: flex; gap: 2px; margin-left: 12px; }
  .page-tabs a {
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 4px;
  }
  .page-tabs a:hover { color: var(--text); background: var(--surface2); }
  .page-tabs a[aria-current="page"] { color: #000; background: var(--accent); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px; border-radius: 4px;
    border: 1px solid transparent; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; text-decoration: none; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-secondary { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 48px; }
  .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
  .page-note { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .page-note button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  .page-note button:hover { text-decoration: underline; }
  .page-note button:disabled { color: var(--muted); cursor: default; text-decoration: none; }

  /* TILES — click a tile to open its page */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .tile {
    display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px;
    min-width: 0; color: inherit; text-decoration: none; position: relative;
  }
  a.tile { transition: border-color 0.15s; }
  a.tile:hover { border-color: var(--accent); }
  a.tile::after { content: '→'; position: absolute; top: 14px; right: 16px; color: var(--muted); font-size: 14px; }
  a.tile:hover::after { color: var(--accent); }
  .tile-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
  .tile-value { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.05; color: var(--text); white-space: nowrap; }
  .tile-value.accent { color: var(--accent); }
  .tile-sub { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.status { border-left-width: 3px; }
  .tile.status.ok { border-left-color: var(--success); }
  .tile.status.bad { border-left-color: var(--danger); background: rgba(224,82,82,0.06); }
  .tile.status.bad .tile-value { color: var(--danger); }
  .status-tag { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-left: 8px; vertical-align: 10px; }
  .tile.status.ok .status-tag { color: var(--success); }
  .tile.status.bad .status-tag { color: var(--danger); }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin: 24px 0 12px;
  }
  .soon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .soon { background: var(--surface); border: 1px dashed var(--border); border-radius: 6px; padding: 14px 16px; }
  .soon h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
  .soon p { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .error-box { background: rgba(224,82,82,0.08); border: 1px solid rgba(224,82,82,0.4); color: #f0a0a0; border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; display: none; }

  #loading { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 2px; text-transform: uppercase; }
  #loading.hidden { display: none; }

  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) {
    header { padding: 0 12px; gap: 8px; }
    .who, .header-wide { display: none !important; }
    .header-right { gap: 6px; }
    .header-right .btn-sm { padding: 5px 8px; font-size: 11px; letter-spacing: 0.5px; }
    .page-tabs { margin-left: 4px; }
    .page-tabs a { padding: 5px 7px; font-size: 13px; letter-spacing: 0.5px; }
    .page-tabs { overflow-x: auto; scrollbar-width: none; flex-shrink: 1; min-width: 0; }   /* v319: 5 tabs — slide sideways if needed */
    .page-tabs a { padding: 5px 6px; font-size: 12px; flex-shrink: 0; }
    .logo { font-size: 20px; }
    main { padding: 16px 16px 40px; }
    .grid { grid-template-columns: 1fr; }
    .tile-value { font-size: 34px; }
  }

  /* v319: ORDERS */
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  .seg { display: inline-flex; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 3px; gap: 2px; }
  .seg button {
    background: none; border: none; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 0.5px; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; cursor: pointer;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #000; }
  .search {
    flex: 1; min-width: 220px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 6px;
    padding: 9px 12px; font-family: 'Barlow', sans-serif; font-size: 14px; outline: none;
  }
  .search:focus { border-color: var(--accent); }
  .summary { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .orders { display: flex; flex-direction: column; gap: 8px; }
  .order {
    /* display: grid; grid-template-columns: 110px 1fr auto; gap: 14px; align-items: start; */
    display: grid; grid-template-columns: 110px 64px 1fr auto; gap: 14px; align-items: start;   /* v320: + photo */
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px 16px;
    cursor: pointer;   /* v320: click to open */
  }
  .order:hover { border-color: #444; }
  .o-thumb { width: 64px; height: 64px; border-radius: 4px; background: var(--surface2); border: 1px solid var(--border); object-fit: cover; display: block; }

  /* v320: ORDER DETAIL — looks like the eBay listing */
  #detail { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 60; display: none; overflow-y: auto; padding: 24px 16px; }
  #detail.open { display: block; }
  .d-box { max-width: 1100px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; position: relative; }
  .d-close { position: absolute; top: 12px; right: 12px; }
  .d-order { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; color: var(--text2); font-size: 13px; padding-bottom: 14px; border-bottom: 1px solid var(--border); margin-bottom: 18px; padding-right: 90px; }
  .d-order .o-total { font-size: 26px; color: var(--text); }
  .d-item + .d-item { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--border); }
  .d-top { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; }
  .d-main { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: #fff; border-radius: 6px; border: 1px solid var(--border); }
  .d-strip { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; padding-bottom: 4px; }
  .d-strip img { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 2px solid transparent; cursor: pointer; flex-shrink: 0; background: var(--surface2); }
  .d-strip img.on { border-color: var(--accent); }
  .d-title { font-size: 20px; font-weight: 600; line-height: 1.35; margin-bottom: 10px; }
  .d-price { font-family: 'Barlow Condensed', sans-serif; font-size: 32px; font-weight: 700; margin-bottom: 6px; }
  .d-facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin: 12px 0; }
  .d-facts dt { color: var(--muted); }
  .d-facts dd { color: var(--text); }
  .d-h { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
  .d-specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 24px; font-size: 13px; }
  .d-specs div { display: grid; grid-template-columns: 45% 55%; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border); }
  .d-specs span:first-child { color: var(--muted); }
  .d-desc { width: 100%; border: 1px solid var(--border); border-radius: 6px; background: #fff; min-height: 200px; }
  .d-msg { color: var(--muted); padding: 20px 0; }
  @media (max-width: 800px) {
    .d-top { grid-template-columns: 1fr; }
    .d-specs { grid-template-columns: 1fr; }
    #detail { padding: 0; }
    .d-box { border-radius: 0; border: none; min-height: 100vh; padding: 16px; }
  }
  .order.off { opacity: 0.55; }
  .o-when { color: var(--text2); font-size: 13px; line-height: 1.4; }
  .o-when .o-id { color: var(--muted); font-size: 11px; font-family: ui-monospace, Menlo, monospace; }
  .o-item { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; line-height: 1.4; }
  .o-item + .o-item { margin-top: 6px; }
  .o-title { color: var(--text); text-decoration: none; font-size: 14px; }
  a.o-title:hover { color: var(--accent); text-decoration: underline; }
  .o-sku { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--text2); background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
  .o-sku b { color: var(--accent); font-weight: 700; }
  .o-qty { color: var(--accent); font-weight: 600; font-size: 13px; }
  .o-right { text-align: right; white-space: nowrap; }
  .o-total { font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; }
  .chip { display: inline-block; margin-top: 4px; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 8px; border-radius: 3px; border: 1px solid; }
  .chip.ship { color: var(--accent); border-color: var(--accent); }
  .chip.done { color: var(--success); border-color: rgba(76,175,130,0.5); }
  .chip.bad { color: var(--danger); border-color: rgba(224,82,82,0.5); }
  .chip.part { color: var(--text2); border-color: var(--border); }
  /* v371: Late returns */
  #late { display: none; margin-bottom: 18px; }
  #late.on { display: block; }
  #late .d-h { margin-top: 6px; }
  .late-row { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; background: var(--surface); }
  .late-row img { width: 56px; height: 56px; object-fit: cover; border-radius: 4px; background: var(--surface2); }
  .late-row .l-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-items: center; }
  .late-row .late-soon, .late-soon { color: #e0a030; font-weight: 600; }
  .kind.late { color: #e0a030; border-color: rgba(224,160,48,0.5); }   /* v372 */
  .kind.cancel { color: #6aa8ff; border-color: rgba(106,168,255,0.5); }   /* v373 */
  .kind.dispute { color: var(--danger); border-color: rgba(224,82,82,0.5); }
  #seg-stage { display: none; margin: -4px 0 10px; }
  #seg-stage.on { display: inline-flex; flex-wrap: wrap; }
  #seg-stage button { font-size: 12px; padding: 4px 10px; }
  @media (max-width: 700px) { #seg-kind { flex-wrap: wrap; max-width: 100%; } #seg-kind button { white-space: nowrap; } }   /* v372: 5 buttons fit on a phone */
  .o-right .l-acts { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .order .o-right .l-acts .btn { cursor: pointer; }
  @media (max-width: 640px) { .late-row { grid-template-columns: 48px 1fr; } .late-row .l-acts { grid-column: 1 / -1; justify-content: flex-start; } }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  .more { margin: 14px auto 0; display: block; }
  @media (max-width: 700px) {
    /* .order { grid-template-columns: 1fr auto; gap: 6px 12px; padding: 12px; } */
    .order { grid-template-columns: 56px 1fr auto; gap: 6px 12px; padding: 12px; }   /* v320: + photo */
    .o-thumb { width: 56px; height: 56px; }
    .o-when { grid-column: 1 / -1; display: flex; gap: 8px; align-items: baseline; }
    .seg button { padding: 6px 9px; font-size: 13px; }
    .search { min-width: 0; width: 100%; flex-basis: 100%; }
  }

  /* v324: RETURNS (cards reuse the Orders look) */
  .kind { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 1px 7px; border-radius: 3px; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); margin-right: 6px; }
  .kind.case { color: var(--danger); border-color: rgba(224,82,82,0.5); }
  .kind.inquiry { color: var(--accent); border-color: rgba(245,166,35,0.5); }
  .r-line { font-size: 13px; color: var(--text2); margin-top: 4px; line-height: 1.4; }
  .r-due { color: var(--accent); font-weight: 600; }
  .r-due.late { color: var(--danger); }
  .acts { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
  .acts h4 { font-family: 'Barlow Condensed', sans-serif; font-size: 13px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .acts .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .acts textarea { width: 100%; min-height: 70px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 8px 10px; font: inherit; margin-bottom: 10px; }
  .acts input[type=number], .acts input[type=text], .acts input[type=date], .acts select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 4px; padding: 6px 8px; font: inherit; color-scheme: dark; }
  .acts input[type=number] { width: 110px; }
  .acts label { font-size: 13px; color: var(--text2); display: inline-flex; gap: 6px; align-items: center; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-danger { background: var(--surface2); color: var(--danger); border-color: rgba(224,82,82,0.5); }
  .hist { font-size: 13px; line-height: 1.5; }
  .hist div { padding: 6px 0; border-bottom: 1px solid var(--border); }
  .hist span { color: var(--muted); }
  .quote { background: var(--surface2); border-left: 3px solid var(--border); padding: 8px 12px; border-radius: 4px; margin: 8px 0; white-space: pre-wrap; font-size: 14px; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #0b0b0b; border: 1px solid #3a3a3a; border-left: 3px solid var(--success); padding: 12px 18px; border-radius: 6px; z-index: 200; display: none; max-width: calc(100% - 32px); }
  #toast.show { display: block; }
  #toast.error { border-left-color: var(--danger); }
  .order { grid-template-columns: 64px 1fr auto; }
  @media (max-width: 700px) { .order { grid-template-columns: 56px 1fr auto; } }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<header>
  <a href="/" class="logo-link" title="Home">
    <div class="logo"><span>PARTS</span>LISTER</div>
    <div class="logo-sub">PRO <span style="font-size:9px;opacity:0.6;font-weight:400;letter-spacing:0.5px;">v382</span></div>
  </a>
  <nav class="page-tabs" aria-label="Pages">
    <!-- v318: was Home / Sales / Listings (the active page)
    <a href="/">Home</a>
    <a href="/sales">Sales</a>
    <a href="/listings" aria-current="page">Listings</a>
    -->
    <a href="/">Home</a>
    <a href="/sales">Sales</a>
    <a href="/orders">Orders</a>   <!-- v319 -->
    <a href="/messages">Messages</a>   <!-- v321 -->
    <a href="/returns" aria-current="page">Returns</a>   <!-- v324 -->
    <a href="/active">Active</a>
    <a href="/list" title="Open the Listing Tool">Listings</a>   <!-- v318: the Listing Tool -->
  </nav>
  <div class="header-right">
    <span class="who" id="who"></span>
    <!-- <a href="/list" class="btn btn-secondary btn-sm header-wide">Listing Tool →</a>   v318: now the Listings tab -->
    <a href="/sales?settings=1" class="btn btn-secondary btn-sm" title="Settings" aria-label="Settings">⚙</a>
    <button class="btn btn-secondary btn-sm header-wide" onclick="logout()">Log Out</button>
  </div>
</header>

<main>
  <div class="page-title">Returns</div>
  <div class="page-note" id="r-note">&nbsp;</div>
  <div class="error-box" id="r-error"></div>

  <!-- <div id="late"></div> -->   <!-- v371: Late returns (v372: now a button in the row below) -->
  <div class="controls">
    <div class="seg" role="group" aria-label="Open or closed" id="seg-view">
      <button type="button" data-view="open">Open</button>
      <button type="button" data-view="closed">Closed (90 days)</button>
    </div>
    <div class="seg" role="group" aria-label="Kind" id="seg-kind">
      <button type="button" data-kind="all">All</button>
      <button type="button" data-kind="return">Returns</button>
      <button type="button" data-kind="late" id="late-btn" style="display:none">Late returns</button>   <!-- v372 -->
      <button type="button" data-kind="inquiry">Not received</button>
      <button type="button" data-kind="case">Cases</button>
      <button type="button" data-kind="cancel">Cancellations</button>   <!-- v373 -->
      <button type="button" data-kind="dispute">Disputes</button>       <!-- v373 -->
    </div>
    <input type="search" class="search" id="r-search" placeholder="Search buyer, item, reason or number" autocomplete="off">
  </div>
  <div class="seg" role="group" aria-label="Stage" id="seg-stage"></div>   <!-- v373 -->
  <div class="summary" id="r-summary">&nbsp;</div>

<script>
// ─── v380: SAVED COPY ────────────────────────────────────────────────────────
// Coming back to this page shows what it loaded last time right away, then quietly checks eBay and
// updates the page if anything changed. Kept in this browser tab only (sessionStorage): gone when
// you close the tab or log out — never saved on the server or on disk.
// v381: + remembers you're signed in (no sign-in screen flash) and, a few seconds after a page
//       loads, quietly loads the other pages' data so their first open is instant too.
// v382: switching views on a page (Open/Closed, Buyers/From eBay, 7/31/90 days…) uses the saved copy too.
//       Reloading the browser page, or pressing a Refresh button, really reloads from eBay.
const pageCache = { urls: [], rerun: null, liveUntil: 0, live() { this.liveUntil = Date.now() + 3000; } };
try { if ((performance.getEntriesByType('navigation')[0] || {}).type === 'reload') pageCache.liveUntil = Date.now() + 5000; } catch (e) { /* fine */ }
(function () {
  const realFetch = window.fetch.bind(window);
  const KEY = 'plp-cache:';
  const first = new Set(), fresh = new Map();
  let pending = 0, changed = false;
  const isGet = (opt) => !opt || !opt.method || String(opt.method).toUpperCase() === 'GET';
  const want = (url, opt) => typeof url === 'string' && isGet(opt) && pageCache.urls.some(r => r.test(url));
  const read = (url) => { try { return sessionStorage.getItem(KEY + url); } catch (e) { return null; } };
  const write = (url, text) => { try { if (!/"(loading|checking)":true/.test(text)) sessionStorage.setItem(KEY + url, text); } catch (e) { /* full or blocked — fine */ } };
  const asResponse = (text) => new Response(text, { status: 200, headers: { 'Content-Type': 'application/json' } });
  const signedIn = (yes) => { try { if (yes) sessionStorage.setItem('plp-signed-in', '1'); else sessionStorage.removeItem('plp-signed-in'); } catch (e) { /* fine */ } };   // v381
  const clearAll = () => { try { Object.keys(sessionStorage).filter(k => k.startsWith('plp-')).forEach(k => sessionStorage.removeItem(k)); } catch (e) { /* fine */ } };
  const watch = (url, r) => { if (url === '/api/me') { if (r.status === 200) signedIn(true); else if (r.status === 401) clearAll(); } };   // v381
  window.fetch = async function (url, opt) {
    if (typeof url === 'string' && url === '/api/logout') clearAll();
    if (!want(url, opt)) { const r = await realFetch(url, opt); watch(url, r); return r; }
    const f = fresh.get(url);
    if (f && Date.now() - f.at < 60000) { fresh.delete(url); if (f.status === 200) return asResponse(f.text); }
    // if (!first.has(url)) {   (v381: only the first time on this page)
    first.add(url);
    if (Date.now() >= pageCache.liveUntil) {   // v382: every time, unless you just reloaded or pressed Refresh
      const saved = read(url);
      if (saved !== null) {
        pending++;
        realFetch(url, opt).then(async r => {
          watch(url, r);
          const text = await r.text();
          if (r.status === 200) write(url, text);
          else { try { sessionStorage.removeItem(KEY + url); } catch (e) { /* fine */ } }
          fresh.set(url, { at: Date.now(), status: r.status, text });
          if (r.status !== 200 || text !== saved) changed = true;
        }).catch(() => {}).finally(() => {
          if (--pending === 0 && changed) { changed = false; if (pageCache.rerun) pageCache.rerun(); }
        });
        return asResponse(saved);
      }
    }
    const r = await realFetch(url, opt);
    watch(url, r);
    if (r.status === 200) r.clone().text().then(t => write(url, t)).catch(() => {});
    return r;
  };
  // v381: load the other pages' data in the background (only what this tab doesn't have yet), one at a time
  const LA = encodeURIComponent('America/Los_Angeles');
  let ordersDays = 31; try { ordersDays = parseInt(localStorage.getItem('plp_orders_days'), 10) || 31; } catch (e) { /* default */ }
  const ALL = ['/api/me', '/api/sales?tz=' + LA, '/api/fees?tz=' + LA, '/api/listings/summary', '/api/messages/summary', '/api/returns/summary',
    '/api/orders/list?days=' + ordersDays + '&tz=' + LA, '/api/threads?type=members', '/api/followups', '/api/msg-settings',
    '/api/returns?view=open', '/api/late-returns', '/api/listings/daily',
    // v382: the other views, so switching is instant
    '/api/threads?type=ebay', '/api/returns?view=closed'].concat([7, 31, 90, 365].filter(d => d !== ordersDays).map(d => '/api/orders/list?days=' + d + '&tz=' + LA));
  setTimeout(async () => {
    try { if (!sessionStorage.getItem('plp-signed-in')) return; } catch (e) { return; }
    for (const url of ALL) {
      if (read(url) !== null || first.has(url)) continue;
      try { const r = await realFetch(url); if (r.status === 401) { clearAll(); return; } if (r.status === 200) write(url, await r.text()); } catch (e) { /* skip */ }
    }
  }, 3000);
})();
pageCache.urls = [/^\/api\/me$/, /^\/api\/returns\?view=/, /^\/api\/late-returns$/, /^\/api\/items\/\d+$/];   // v380
// ─── SHARED (same on Home and Listings) ─────────────────────────────────────
const EBAY_TZ = 'America/Los_Angeles';   // eBay counts days in Pacific time
const money0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const money2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
function setText(id, text) { document.getElementById(id).textContent = text; }
function ebayTodayKey() { return new Intl.DateTimeFormat('en-CA', { timeZone: EBAY_TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
function keyPlus(key, n) { const [y, m, d] = key.split('-').map(Number); const t = new Date(y, m - 1, d + n); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
function timeAgo(iso) {
  if (!iso) return 'never';
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' hr ago';
  return Math.round(hrs / 24) + ' days ago';
}
async function getJSON(url) {
  try { const r = await fetch(url); if (r.status === 401) return { _signedOut: true }; return r.ok ? await r.json() : null; }
  catch (e) { return null; }
}
async function logout() {
  await fetch('/api/logout', { method: 'POST' }).catch(() => {});
  location.href = '/sales';
}
// Not signed in → the sign-in screen on the Sales page, then back here
async function loadMe() {
  const me = await getJSON('/api/me');
  if (!me || me._signedOut) { location.href = '/sales?next=' + encodeURIComponent(location.pathname); return null; }

// ─── RETURNS ─────────────────────────────────────────────────────────────────
// v324: returns, "item not received" claims and cases, read live from eBay.
// Every action asks you to confirm before it goes to eBay.
let items = [], view = 'open', kindF = 'all', isAdmin = false;
const titles = {}, pics = {};   // itemId → title / photo

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined) n.textContent = text; return n; }
let toastTimer;
function toast(msg, bad) { const t = document.getElementById('toast'); t.textContent = msg; t.className = 'show' + (bad ? ' error' : ''); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', bad ? 8000 : 4000); }
const nice = (s) => { s = String(s || '').replace(/_/g, ' ').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); };
// const KIND = { return: 'Return', inquiry: 'Not received', case: 'Case' };
const KIND = { return: 'Return', inquiry: 'Not received', case: 'Case', cancel: 'Cancellation', dispute: 'Payment dispute' };   // v373
// v373: stages
function returnStage(x) {
  const s = (String(x.status || '') + ' ' + String(x.state || '')).toUpperCase();
  if (/CLOSED/.test(s)) return 'closed';
  if (/DELIVERED|RECEIVED/.test(s)) return 'delivered';
  if (/SHIPPED|IN_TRANSIT/.test(s)) return 'shipped';
  if (/REQUESTED/.test(s) && !/LABEL/.test(s)) return 'requested';
  return 'waiting';
}
const needsAttention = (x) => x.kind === 'return' ? (/SELLER/i.test(x.todo || '') || (x.options || []).length > 0)
  : x.kind === 'cancel' ? !!x.needsMe : x.kind === 'dispute' ? /ACTION_NEEDED/i.test(x.status || '') : true;
const STAGES = {
  return: [['all', 'All open'], ['needs', 'Needs attention'], ['requested', 'Requested'], ['waiting', 'Waiting for buyer to ship'], ['shipped', 'Shipped'], ['delivered', 'Delivered']],
  dispute: [['all', 'All open'], ['action', 'Needs your response'], ['decision', 'Awaiting decision']]
};
function stageOk(x) {
  if (view !== 'open' || stageF === 'all' || !STAGES[kindF]) return true;
  if (kindF === 'return') return stageF === 'needs' ? needsAttention(x) : returnStage(x) === stageF;
  if (kindF === 'dispute') return stageF === 'action' ? /ACTION_NEEDED/i.test(x.status || '') : !/ACTION_NEEDED/i.test(x.status || '');
  return true;
}
const STAGE_LABEL = { requested: 'Requested', waiting: 'Waiting for buyer to ship', shipped: 'Shipped', delivered: 'Delivered' };
let stageF = 'all', disputesNeedScope = false;
const dateStr = (iso) => iso ? new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '';
function dueEl(iso) {
  if (!iso) return null;
  const hrs = (new Date(iso) - Date.now()) / 3600e3;
  const s = el('span', 'r-due' + (hrs < 24 ? ' late' : ''), hrs < 0 ? 'Response was due ' + dateStr(iso) : 'Respond by ' + new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }));
  return s;
}

function render() {

  const q = norm(document.getElementById('r-search').value).trim();
  // const list = items.filter(x => (kindF === 'all' || x.kind === kindF) &&
  // v373: stage buttons under Returns / Disputes (open only)
  const sg = document.getElementById('seg-stage');
  const stages = view === 'open' ? STAGES[kindF] : null;

    if (!stages.some(st => st[0] === stageF)) stageF = 'all';
    const ofKind = items.filter(x => x.kind === kindF);
    stages.forEach(([k, label]) => {
      const n = k === 'all' ? ofKind.length : ofKind.filter(x => { const keep = stageF; stageF = k; const ok = stageOk(x); stageF = keep; return ok; }).length;
      const b = el('button', '', label + (n ? ' ' + n : '')); b.type = 'button';
      b.setAttribute('aria-pressed', k === stageF ? 'true' : 'false');

  document.querySelectorAll('#seg-kind button').forEach(b => {

    b.textContent = b.dataset.label + (n ? ' ' + n : '');
  });

  const list = kindF === 'late' ? [] : items.filter(x => (kindF === 'all' || x.kind === kindF) && stageOk(x) &&   // v373: + stage
    (!q || norm([x.buyer, x.id, x.orderId, x.itemId, x.reason, x.status, x.comments, titles[x.itemId]].join(' ')).includes(q)));
  // v372: Late returns — open ones under Open, refunded ones under Closed
  const lateView = lateItems.filter(x => view === 'open' ? !x.refunded : !!x.refunded);
  const lateShown = (kindF === 'all' || kindF === 'late') ? lateView.filter(x => !q || norm([x.orderId, x.itemId, x.title, titles[x.itemId]].join(' ')).includes(q)) : [];
  const lb = document.getElementById('late-btn');
  lb.style.display = (lateEnabled || lateItems.length) ? '' : 'none';
  lb.textContent = 'Late returns' + (lateView.length ? ' ' + lateView.length : '');
  const c = (k) => items.filter(x => x.kind === k).length;
  // setText('r-summary', list.length + ' shown · ' + c('return') + ' return' + (c('return') === 1 ? '' : 's') + ' · ' + c('inquiry') + ' not received · ' + c('case') + ' case' + (c('case') === 1 ? '' : 's'));
  setText('r-summary', (list.length + lateShown.length) + ' shown · ' + c('return') + ' return' + (c('return') === 1 ? '' : 's') + (lateEnabled || lateItems.length ? ' · ' + lateView.length + ' late' : '') + ' · ' + c('inquiry') + ' not received · ' + c('case') + ' case' + (c('case') === 1 ? '' : 's')
    + ' · ' + c('cancel') + ' cancellation' + (c('cancel') === 1 ? '' : 's') + ' · ' + c('dispute') + ' dispute' + (c('dispute') === 1 ? '' : 's'));   // v373
  const box = document.getElementById('r-list');
  box.textContent = '';
  // if (!list.length) { box.append(el('div', 'empty', items.length ? 'Nothing matches.' : (view === 'open' ? 'No open returns, claims or cases. Nice.' : 'Nothing closed in the last 90 days.'))); return; }
  if (kindF === 'dispute' && disputesNeedScope) {   // v373

  }
  if (!list.length && !lateShown.length && kindF in KIND && kindF !== 'return') {   // v373
    box.append(el('div', 'empty', items.some(x => x.kind === kindF) ? 'Nothing matches.' : 'No ' + (view === 'open' ? 'open' : 'closed') + ' ' + { inquiry: 'not-received claims', case: 'cases', cancel: 'cancellation requests', dispute: 'payment disputes' }[kindF] + '.'));
    return;
  }
  if (!list.length && !lateShown.length) {
    box.append(el('div', 'empty', kindF === 'late'
      ? (lateView.length ? 'Nothing matches.' : view === 'open' ? 'No late returns. When you send a buyer your return address in Messages, the sale shows up here.' : 'No refunded late returns in the last 7 days.')

    return;
  }
  lateShown.forEach(x => box.append(lateRow(x)));   // v372
  list.forEach(x => {
    const row = el('div', 'order');
    row.addEventListener('click', () => openDetail(x.kind + ':' + x.id));

    const mid = el('div');

// Item photos + titles (the server remembers them per item)
let filling = false;
async function fillItems() {
  if (filling) return; filling = true;
  try {
    const ids = [...new Set(items.map(x => x.itemId).filter(id => id && !(id in titles)))];
    for (let k = 0; k < ids.length; k += 4) {
      await Promise.all(ids.slice(k, k + 4).map(async id => {
        const d = await getJSON('/api/items/' + encodeURIComponent(id));
        titles[id] = (d && d.item && d.item.title) || '';
        pics[id] = (d && d.item && d.item.pictures && d.item.pictures[0]) || null;
        document.querySelectorAll('img.o-thumb[data-item="' + id + '"]').forEach(im => { if (pics[id]) im.src = pics[id]; });
        document.querySelectorAll('.o-title[data-title="' + id + '"]').forEach(t => { if (titles[id]) t.textContent = titles[id]; });
      }));
    }
  } finally { filling = false; }
}

async function load() {
  const me = await loadMe();
  if (!me) return;
  isAdmin = !!me.isAdmin;
  setText('r-note', 'Loading from eBay…');
  loadLate();   // v371
  const d = await getJSON('/api/returns?view=' + view);
  document.getElementById('loading').classList.add('hidden');
  const err = document.getElementById('r-error'); err.style.display = 'none';
  if (!d) { err.textContent = 'Could not reach the server.'; err.style.display = 'block'; return; }
  if (!d.connected) { setText('r-note', 'eBay isn’t connected yet' + (isAdmin ? ' — connect it in Settings → Admin.' : '.')); items = []; render(); return; }
  if (d.errors && d.errors.length) { err.textContent = 'eBay had a problem with part of this: ' + d.errors.join(' | '); err.style.display = 'block'; }
  items = d.items || [];
  disputesNeedScope = !!d.disputesNeedScope;   // v373
  setText('r-note', 'From eBay · checked ' + new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' · ');
  const r = el('button', '', 'Refresh'); r.type = 'button'; r.onclick = () => { pageCache.live(); load(); };   // v382: Refresh really asks eBay
  document.getElementById('r-note').append(r);
  render();
  const hm = /^#r=(.+)$/.exec(location.hash);
  if (hm) showDetail(decodeURIComponent(hm[1]));
}

let lateItems = [], lateEnabled = false;   // v372
async function loadLate() {
  const d = await getJSON('/api/late-returns');
  if (!d || d._signedOut || d.error) return;
  lateItems = d.items || []; lateEnabled = !!d.enabled;
  render();
  const ids = [...new Set(lateItems.map(x => x.itemId).filter(id => id && !(id in titles)))];
  for (const id of ids) {
    const d2 = await getJSON('/api/items/' + encodeURIComponent(id));
    titles[id] = (d2 && d2.item && d2.item.title) || '';
    pics[id] = (d2 && d2.item && d2.item.pictures && d2.item.pictures[0]) || null;
    document.querySelectorAll('img.o-thumb[data-item="' + id + '"]').forEach(im => { if (pics[id]) im.src = pics[id]; });
    document.querySelectorAll('.o-title[data-title="' + id + '"]').forEach(t => { if (titles[id]) t.textContent = titles[id]; });
  }
}

    l2.append(el('span', left <= 7 ? 'late-soon' : '', left > 0 ? left + ' day' + (left === 1 ? '' : 's') + ' left' : 'drops off today'));
  }

  if (!x.refunded) {

    else {
      const a = el('a', 'btn btn-primary btn-sm', 'Refund on eBay'); a.href = 'https://www.ebay.com/sh/ord'; a.target = '_blank'; a.rel = 'noopener';
      a.title = 'Opens your eBay orders — search order ' + (x.orderId || '') + ' and refund it there';

      if (x.orderId) btn('Copy order #', 'btn-secondary', () => navigator.clipboard.writeText(x.orderId).then(() => toast('Order number copied.'), () => toast('Couldn’t copy.', true)));

  right.append(acts);
  row.append(img, mid, right);
  return row;
}

function openDetail(key) { const h = '#r=' + encodeURIComponent(key); if (location.hash !== h) location.hash = h; else showDetail(key); }
function closeDetail() { if (location.hash.startsWith('#r=')) history.back(); else hideDetail(); }
function hideDetail() { document.getElementById('detail').classList.remove('open'); document.body.style.overflow = ''; }
window.addEventListener('hashchange', () => { const m = /^#r=(.+)$/.exec(location.hash); if (m) showDetail(decodeURIComponent(m[1])); else hideDetail(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.getElementById('detail').classList.contains('open')) closeDetail(); });

async function act(url, body, confirmText, okText) {
  if (!confirm(confirmText)) return false;
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const out = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(out.error || 'eBay said no.');
    toast(okText + (out.status ? ' (eBay: ' + nice(out.status) + ')' : ''));
    closeDetail(); setTimeout(load, 600);
    return true;
  } catch (e) { toast(e.message, true); return false; }
}

  // acts.append(link);
  // v325: eBay sends a link for each next step on a return, already pointing at the right
  // page for its stage (requested, shipped, delivered…). Show those; otherwise the returns list.
  const lr = el('div', 'row'); lr.style.marginTop = '8px';
  const links = x.links || [];
  if (links.length) {
    links.forEach((o, n) => {
      const a = el('a', 'btn btn-secondary btn-sm', (n === 0 ? 'Open on eBay: ' : '') + nice(o.type.replace(/^SELLER_/, '')));
      a.href = o.url; a.target = '_blank'; a.rel = 'noopener';
      lr.append(a);
    });
  } else {
    const a = el('a', 'btn btn-secondary btn-sm', 'Open eBay orders');
    a.href = 'https://www.ebay.com/sh/ord'; a.target = '_blank'; a.rel = 'noopener';   // the page that worked before
    // lr.append(a, el('span', 'r-line', 'eBay didn\u2019t send a direct link for this one.'));
    lr.append(a); if (x.kind === 'return') lr.append(el('span', 'r-line', 'eBay didn\u2019t send a direct link for this one.'));   // v373
  }
  acts.append(lr);
}

document.querySelectorAll('#seg-view button').forEach(b => b.addEventListener('click', () => { view = b.dataset.view; load(); }));
// document.querySelectorAll('#seg-kind button').forEach(b => b.addEventListener('click', () => { kindF = b.dataset.kind; render(); }));
document.querySelectorAll('#seg-kind button').forEach(b => b.addEventListener('click', () => { kindF = b.dataset.kind; stageF = 'all'; render(); }));   // v373
let st; document.getElementById('r-search').addEventListener('input', () => { clearTimeout(st); st = setTimeout(render, 120); });
pageCache.rerun = () => { if (!document.getElementById('detail').classList.contains('open')) load(); };   // v380: fresh data from eBay → draw the page again
load();
setInterval(() => { if (!document.hidden && !document.getElementById('detail').classList.contains('open')) { pageCache.live(); load(); } }, 5 * 60000);   // v382: live
</script>
</body>
</html>
