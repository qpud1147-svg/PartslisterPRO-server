<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PartsLister Pro Home v319</title>
<!-- PartsLister Pro — Home page (v316: new; v317: cut to three tiles — Sales, Active listings, Needs attention; v318: tabs Home / Sales / Active / Listings). Shares the sign-in, account and
     eBay connection with the Sales page (/sales) and the listing tool (/list). -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  /* Same palette as the Sales page and the listing tool */
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --accent: #f5a623;
    --accent2: #e8912a;
    --text: #e8e8e8;
    --text2: #b8b8b8;
    --muted: #888;
    --success: #4caf82;
    --danger: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px; min-height: 100vh; }

  /* HEADER — same as the Sales page */
  header {
    background: var(--surface); border-bottom: 2px solid var(--accent); padding: 0 24px;
    display: flex; align-items: center; gap: 16px; height: 56px; position: sticky; top: 0; z-index: 10;
  }
  .logo-link { text-decoration: none; color: inherit; }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
  .logo span { color: var(--accent); }
  .logo-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-top: -2px; }
  .page-tabs { display: flex; gap: 2px; margin-left: 12px; }
  .page-tabs a {
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 4px;
  }
  .page-tabs a:hover { color: var(--text); background: var(--surface2); }
  .page-tabs a[aria-current="page"] { color: #000; background: var(--accent); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px; border-radius: 4px;
    border: 1px solid transparent; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; text-decoration: none; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-secondary { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 48px; }
  .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
  .page-note { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .page-note button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  .page-note button:hover { text-decoration: underline; }
  .page-note button:disabled { color: var(--muted); cursor: default; text-decoration: none; }

  /* TILES — click a tile to open its page */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .tile {
    display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px;
    min-width: 0; color: inherit; text-decoration: none; position: relative;
  }
  a.tile { transition: border-color 0.15s; }
  a.tile:hover { border-color: var(--accent); }
  a.tile::after { content: '→'; position: absolute; top: 14px; right: 16px; color: var(--muted); font-size: 14px; }
  a.tile:hover::after { color: var(--accent); }
  .tile-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
  .tile-value { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.05; color: var(--text); white-space: nowrap; }
  .tile-value.accent { color: var(--accent); }
  .tile-sub { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.status { border-left-width: 3px; }
  .tile.status.ok { border-left-color: var(--success); }
  .tile.status.bad { border-left-color: var(--danger); background: rgba(224,82,82,0.06); }
  .tile.status.bad .tile-value { color: var(--danger); }
  .status-tag { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-left: 8px; vertical-align: 10px; }
  .tile.status.ok .status-tag { color: var(--success); }
  .tile.status.bad .status-tag { color: var(--danger); }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin: 24px 0 12px;
  }
  .soon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .soon { background: var(--surface); border: 1px dashed var(--border); border-radius: 6px; padding: 14px 16px; }
  .soon h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
  .soon p { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .error-box { background: rgba(224,82,82,0.08); border: 1px solid rgba(224,82,82,0.4); color: #f0a0a0; border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; display: none; }

  #loading { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 2px; text-transform: uppercase; }
  #loading.hidden { display: none; }

  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) {
    header { padding: 0 12px; gap: 8px; }
    .who, .header-wide { display: none !important; }
    .header-right { gap: 6px; }
    .header-right .btn-sm { padding: 5px 8px; font-size: 11px; letter-spacing: 0.5px; }
    .page-tabs { margin-left: 4px; }
    .page-tabs a { padding: 5px 7px; font-size: 13px; letter-spacing: 0.5px; }
    .page-tabs { overflow-x: auto; scrollbar-width: none; flex-shrink: 1; min-width: 0; }   /* v319: 5 tabs — slide sideways if needed */
    .page-tabs a { padding: 5px 6px; font-size: 12px; flex-shrink: 0; }
    .logo { font-size: 20px; }
    main { padding: 16px 16px 40px; }
    .grid { grid-template-columns: 1fr; }
    .tile-value { font-size: 34px; }
  }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<header>
  <a href="/" class="logo-link" title="Home">
    <div class="logo"><span>PARTS</span>LISTER</div>
    <div class="logo-sub">PRO <span style="font-size:9px;opacity:0.6;font-weight:400;letter-spacing:0.5px;">v319</span></div>
  </a>
  <nav class="page-tabs" aria-label="Pages">
    <!-- v318: was Home / Sales / Listings (the active page)
    <a href="/" aria-current="page">Home</a>
    <a href="/sales">Sales</a>
    <a href="/listings">Listings</a>
    -->
    <a href="/" aria-current="page">Home</a>
    <a href="/sales">Sales</a>
    <a href="/orders">Orders</a>   <!-- v319 -->
    <a href="/active">Active</a>
    <a href="/list" title="Open the Listing Tool">Listings</a>   <!-- v318: the Listing Tool -->
  </nav>
  <div class="header-right">
    <span class="who" id="who"></span>
    <!-- <a href="/list" class="btn btn-secondary btn-sm header-wide">Listing Tool →</a>   v318: now the Listings tab -->
    <a href="/sales?settings=1" class="btn btn-secondary btn-sm" title="Settings" aria-label="Settings">⚙</a>
    <button class="btn btn-secondary btn-sm header-wide" onclick="logout()">Log Out</button>
  </div>
</header>


<main>
  <div class="page-title">Home</div>
  <div class="page-note" id="home-note">&nbsp;</div>
  <div class="error-box" id="home-error"></div>

  <div class="grid">
    <!-- v317: one Sales tile — last 31 days, today underneath -->
    <a class="tile" href="/sales?range=31">
      <div class="tile-label" id="h-31-label">Sales · Last 31 days</div>
      <div class="tile-value accent" id="h-31">—</div>
      <div class="tile-sub" id="h-31-sub">&nbsp;</div>
    </a>
    <!-- v317: replaced by the one Sales tile above
    <a class="tile" href="/sales?range=today">
      <div class="tile-label">Sales today</div>
      <div class="tile-value accent" id="h-today">—</div>
      <div class="tile-sub" id="h-today-sub">&nbsp;</div>
    </a>
    <a class="tile" href="/sales?range=thismonth">
      <div class="tile-label" id="h-month-label">Sales this month</div>
      <div class="tile-value" id="h-month">—</div>
      <div class="tile-sub" id="h-month-sub">&nbsp;</div>
    </a>
    <a class="tile" href="/sales?range=thismonth">
      <div class="tile-label">eBay fees this month</div>
      <div class="tile-value" id="h-fees">—</div>
      <div class="tile-sub" id="h-fees-sub">&nbsp;</div>
    </a>
    -->
    <a class="tile" href="/active">   <!-- v318: was /listings -->
      <div class="tile-label">Active listings</div>
      <div class="tile-value" id="h-active">—</div>
      <div class="tile-sub" id="h-active-sub">&nbsp;</div>
    </a>
    <!-- v317: penalty fees now show under Needs attention, only when you're paying one
    <a class="tile status" id="h-penalty-tile" href="/sales?range=31">
      <div class="tile-label">Penalty fees · Last 31 days</div>
      <div class="tile-value"><span id="h-penalty">—</span><span class="status-tag" id="h-penalty-tag"></span></div>
      <div class="tile-sub" id="h-penalty-sub">&nbsp;</div>
    </a>
    -->
    <div class="tile status" id="h-attn-tile">
      <div class="tile-label">Needs attention</div>
      <div class="tile-value" id="h-attn" style="font-size:30px;">—</div>
      <div id="h-attn-list" style="margin-top:6px;font-size:13px;line-height:1.6;color:var(--text2);"></div>
    </div>
  </div>
</main>

<script>
// ─── SHARED (same on Home and Listings) ─────────────────────────────────────
const EBAY_TZ = 'America/Los_Angeles';   // eBay counts days in Pacific time
const money0 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
const money2 = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', minimumFractionDigits: 2, maximumFractionDigits: 2 });
// function setText(id, text) { document.getElementById(id).textContent = text; }
function setText(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }   // v317: skips tiles that were removed
function ebayTodayKey() { return new Intl.DateTimeFormat('en-CA', { timeZone: EBAY_TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date()); }
function keyPlus(key, n) { const [y, m, d] = key.split('-').map(Number); const t = new Date(y, m - 1, d + n); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
function timeAgo(iso) {
  if (!iso) return 'never';
  const mins = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + ' hr ago';
  return Math.round(hrs / 24) + ' days ago';
}
async function getJSON(url) {
  try { const r = await fetch(url); if (r.status === 401) return { _signedOut: true }; return r.ok ? await r.json() : null; }
  catch (e) { return null; }
}
async function logout() {
  await fetch('/api/logout', { method: 'POST' }).catch(() => {});
  location.href = '/sales';
}
// Not signed in → the sign-in screen on the Sales page, then back here
async function loadMe() {
  const me = await getJSON('/api/me');
  if (!me || me._signedOut) { location.href = '/sales?next=' + encodeURIComponent(location.pathname); return null; }
  setText('who', me.email + (me.isAdmin ? '  · admin' : ''));
  return me;
}

// ─── HOME ────────────────────────────────────────────────────────────────────
// v316: one glance at everything; each tile opens its page.
async function loadHome() {
  const me = await loadMe();
  if (!me) return;
  const tz = encodeURIComponent(EBAY_TZ);
  const [sales, fees, listings] = await Promise.all([
    getJSON('/api/sales?tz=' + tz), getJSON('/api/fees?tz=' + tz), getJSON('/api/listings/summary')
  ]);
  document.getElementById('loading').classList.add('hidden');

  const today = ebayTodayKey(), yesterday = keyPlus(today, -1);
  const month = today.slice(0, 7);
  const [y, m] = month.split('-').map(Number);
  const lastMonth = (m === 1 ? (y - 1) + '-12' : y + '-' + String(m - 1).padStart(2, '0'));
  const from31 = keyPlus(today, -30);
  const attention = [];

  // SALES — with or without sales tax, the same as you set it on the Sales page
  if (!sales || !sales.connected) {
    ['h-today', 'h-month', 'h-fees', 'h-31'].forEach(id => setText(id, '—'));   // v317: + h-31
    setText('h-31-sub', 'Connect eBay to see real sales');   // v317
    setText('h-today-sub', 'Connect eBay to see real sales');
    setText('home-note', 'eBay isn’t connected yet.');
    if (me.isAdmin) attention.push(['Connect your eBay account', '/sales?settings=admin']);
  } else {
    const taxOn = !!me.dashTax && !!sales.taxReady;
    const by = new Map((sales.days || []).map(([k, s, o, t]) => [k, { s: s + (taxOn ? (t || 0) : 0), o }]));
    let monthSales = 0, monthOrders = 0, lastMonthSales = 0;
    by.forEach((v, k) => {
      if (k.startsWith(month)) { monthSales += v.s; monthOrders += v.o; }
      else if (k.startsWith(lastMonth)) lastMonthSales += v.s;
    });
    const t = by.get(today) || { s: 0, o: 0 }, yd = by.get(yesterday) || { s: 0, o: 0 };
    // v317: the Sales tile — last 31 days (today included, like the Sales page), today underneath
    let s31 = 0, o31 = 0;
    by.forEach((v, k) => { if (k >= from31 && k <= today) { s31 += v.s; o31 += v.o; } });
    setText('h-31-label', 'Sales · Last 31 days' + (taxOn ? ' incl. tax' : ''));
    setText('h-31', money0.format(s31));
    setText('h-31-sub', 'Today ' + money0.format(t.s) + ' · ' + t.o + ' order' + (t.o === 1 ? '' : 's') + ' today · ' + o31.toLocaleString() + ' in 31 days');
    setText('h-today', money0.format(t.s));
    setText('h-today-sub', t.o + ' order' + (t.o === 1 ? '' : 's') + ' · Yesterday ' + money0.format(yd.s));
    setText('h-month-label', 'Sales this month' + (taxOn ? ' incl. tax' : ''));
    setText('h-month', money0.format(monthSales));
    setText('h-month-sub', monthOrders + ' orders · Last month ' + money0.format(lastMonthSales));
    setText('home-note', 'From eBay · updated ' + timeAgo(sales.lastSync) + (sales.syncing ? ' · updating now…' : ''));
    if (sales.lastError) attention.push(['eBay sales sync problem', me.isAdmin ? '/sales?settings=admin' : '/sales']);

    // FEES + PENALTY
    if (fees && fees.available) {
      let monthFees = 0, pen31 = 0, penYear = 0;
      (fees.days || []).forEach(([k, f, p]) => {
        if (k.startsWith(month)) monthFees += f;
        if (k >= from31 && k <= today) pen31 += p;
        if (k.startsWith(String(y))) penYear += p;
      });
      setText('h-fees', money0.format(Math.max(0, monthFees)));
      setText('h-fees-sub', monthSales > 0 ? (monthFees / monthSales * 100).toFixed(1) + '% of sales this month' : 'No sales yet this month');
      // const tile = document.getElementById('h-penalty-tile');
      // tile.classList.remove('ok', 'bad');
      const tile = document.getElementById('h-penalty-tile') || document.createElement('div');   // v317: tile removed from Home
      if (pen31 > 0.005) {
        tile.classList.add('bad'); setText('h-penalty', money2.format(pen31)); setText('h-penalty-tag', 'Paying penalty');
        // attention.push(['Paying penalty fees (' + money2.format(pen31) + ' in 31 days)', '/sales?range=31']);
        attention.push(['Paying penalty fees: ' + money2.format(pen31) + ' in the last 31 days (' + money2.format(penYear) + ' in ' + y + ')', '/sales?range=31']);   // v317
      } else {
        tile.classList.add('ok'); setText('h-penalty', '$0'); setText('h-penalty-tag', 'None');
      }
      setText('h-penalty-sub', y + ' so far ' + (penYear > 0.005 ? money2.format(penYear) : '$0'));
    } else {
      setText('h-fees', '—');
      const why = { not_approved: 'Approve "Fees" in Settings → Admin', importing: 'Importing fees from eBay…', error: 'Fee import problem' }[fees && fees.reason] || ' ';
      setText('h-fees-sub', why);
      setText('h-penalty-sub', why);
      if (fees && fees.reason === 'error') attention.push(['eBay fee import problem', me.isAdmin ? '/sales?settings=admin' : '/sales']);
    }
  }

  // ACTIVE LISTINGS
  if (listings && listings.connected) {
    if (listings.activeCount === null) {
      setText('h-active', '—');
      setText('h-active-sub', listings.error ? 'Couldn’t read listings from eBay' : 'Checking eBay…');
    } else {
      setText('h-active', Number(listings.activeCount).toLocaleString());
      setText('h-active-sub', 'Worth ' + money0.format(listings.activeValue || 0) + ' · Listed ever ' + Number(listings.listedLifetime || 0).toLocaleString());
    }
    if (listings.error) attention.push(['Couldn’t read active listings', '/active']);   // v318: was /listings
  } else {
    setText('h-active', '—');
    setText('h-active-sub', 'Connect eBay to see listings');
  }

  // NEEDS ATTENTION
  const at = document.getElementById('h-attn-tile'), list = document.getElementById('h-attn-list');
  at.classList.remove('ok', 'bad');
  list.textContent = '';
  if (attention.length) {
    at.classList.add('bad');
    setText('h-attn', attention.length + (attention.length === 1 ? ' thing' : ' things'));
    attention.forEach(([text, href]) => {
      const a = document.createElement('a');
      a.href = href; a.textContent = '• ' + text; a.style.cssText = 'display:block;color:var(--text);text-decoration:none;';
      list.appendChild(a);
    });
  } else {
    at.classList.add('ok');
    setText('h-attn', 'All clear');
  }
  const soon = document.createElement('div');
  soon.style.cssText = 'color:var(--muted);font-size:12px;margin-top:4px;';
  soon.textContent = 'Returns and buyer messages aren’t connected yet — coming soon.';
  list.appendChild(soon);

  // Keep it fresh while it's open
  clearTimeout(window._homeTimer);
  window._homeTimer = setTimeout(loadHome, (sales && sales.syncing) || (listings && listings.checking) ? 5000 : 5 * 60000);
}
loadHome();
</script>
</body>
</html>
