<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PartsLister Pro Drafts v422</title>
<!-- v422: Drafts page — listings saved from the Listing Tool (kept on the server, so any device sees them). Same look and sign-in as Active. -->
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=Barlow:wght@400;500;600&display=swap');

  /* Same palette as the Sales page and the listing tool */
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222222;
    --border: #2e2e2e;
    --accent: #f5a623;
    --accent2: #e8912a;
    --text: #e8e8e8;
    --text2: #b8b8b8;
    --muted: #888;
    --success: #4caf82;
    --danger: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Barlow', sans-serif; font-size: 14px; min-height: 100vh; }

  /* HEADER — same as the Sales page */
  header {
    background: var(--surface); border-bottom: 2px solid var(--accent); padding: 0 24px;
    display: flex; align-items: center; gap: 16px; height: 56px; position: sticky; top: 0; z-index: 10;
  }
  .logo-link { text-decoration: none; color: inherit; }
  .logo { font-family: 'Barlow Condensed', sans-serif; font-size: 26px; font-weight: 900; letter-spacing: -0.5px; line-height: 1; }
  .logo span { color: var(--accent); }
  .logo-sub { font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 3px; color: var(--accent); text-transform: uppercase; margin-top: -2px; }
  .page-tabs { display: flex; gap: 2px; margin-left: 12px; }
  .page-tabs a {
    font-family: 'Barlow Condensed', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: var(--muted); text-decoration: none; padding: 6px 12px; border-radius: 4px;
  }
  .page-tabs a:hover { color: var(--text); background: var(--surface2); }
  .page-tabs a[aria-current="page"] { color: #000; background: var(--accent); }
  .header-right { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .who { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px; border-radius: 4px;
    border: 1px solid transparent; cursor: pointer; font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase; text-decoration: none; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .btn-secondary { background: var(--surface2); color: var(--text); border-color: var(--border); }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  main { max-width: 1200px; margin: 0 auto; padding: 24px 24px 48px; }
  .page-title { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
  .page-note { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .page-note button { background: none; border: none; color: var(--accent); cursor: pointer; font: inherit; padding: 0; }
  .page-note button:hover { text-decoration: underline; }
  .page-note button:disabled { color: var(--muted); cursor: default; text-decoration: none; }

  /* TILES — click a tile to open its page */
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 12px; }
  .tile {
    display: block; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px;
    min-width: 0; color: inherit; text-decoration: none; position: relative;
  }
  a.tile { transition: border-color 0.15s; }
  a.tile:hover { border-color: var(--accent); }
  a.tile::after { content: '→'; position: absolute; top: 14px; right: 16px; color: var(--muted); font-size: 14px; }
  a.tile:hover::after { color: var(--accent); }
  .tile-label { font-size: 12px; color: var(--muted); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px; }
  .tile-value { font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.05; color: var(--text); white-space: nowrap; }
  .tile-value.accent { color: var(--accent); }
  .tile-sub { font-size: 12px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile.status { border-left-width: 3px; }
  .tile.status.ok { border-left-color: var(--success); }
  .tile.status.bad { border-left-color: var(--danger); background: rgba(224,82,82,0.06); }
  .tile.status.bad .tile-value { color: var(--danger); }
  .status-tag { display: inline-block; font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-left: 8px; vertical-align: 10px; }
  .tile.status.ok .status-tag { color: var(--success); }
  .tile.status.bad .status-tag { color: var(--danger); }

  .section-title {
    font-family: 'Barlow Condensed', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--border); margin: 24px 0 12px;
  }
  .soon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .soon { background: var(--surface); border: 1px dashed var(--border); border-radius: 6px; padding: 14px 16px; }
  .soon h3 { font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px; }
  .soon p { color: var(--muted); font-size: 12px; line-height: 1.45; }
  .error-box { background: rgba(224,82,82,0.08); border: 1px solid rgba(224,82,82,0.4); color: #f0a0a0; border-radius: 6px; padding: 10px 12px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; display: none; }

  /* v374: LISTINGS PER DAY — same look as the Sales chart */
  :root { --grid: #2a2a2a; --bar-dim: #7a5a24; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px 18px 10px; margin-bottom: 12px; }
  .chart-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .chart-top h2 { font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700; letter-spacing: 0.5px; }
  .range-picker { margin-left: auto; display: inline-flex; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 3px; gap: 2px; }
  .range-picker button { background: none; border: none; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  .range-picker button:hover { color: var(--text); }
  .range-picker button[aria-pressed="true"] { background: var(--accent); color: #000; }
  .lstats { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 8px; }
  .lstat .v { font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1.05; }
  .lstat .v.accent { color: var(--accent); }
  .lstat .k { font-size: 12px; color: var(--muted); }
  .chart-note { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #lchart-wrap { position: relative; height: 300px; }
  #lchart { display: block; width: 100%; height: 100%; touch-action: pan-y; }
  #lchart .gridline { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
  #lchart .baseline { stroke: #3a3a3a; stroke-width: 1; shape-rendering: crispEdges; }
  #lchart .tick { fill: var(--muted); font-family: 'Barlow', sans-serif; font-size: 11px; }
  #lchart .bar { fill: var(--accent); }
  #lchart.hovering .bar { fill: var(--bar-dim); }
  #lchart.hovering .bar.active { fill: var(--accent); }
  #lchart .avgline { stroke: var(--text2); stroke-width: 1; stroke-dasharray: 4 4; }
  .tooltip { position: absolute; pointer-events: none; background: #0b0b0b; border: 1px solid #3a3a3a; border-radius: 6px; padding: 8px 12px; font-size: 12px; color: var(--text2); white-space: nowrap; opacity: 0; transform: translate(-50%, -100%); z-index: 5; box-shadow: 0 6px 20px rgba(0,0,0,0.5); }
  .tooltip.show { opacity: 1; }
  .tooltip .tt-value { display: block; font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.1; }
  @media (max-width: 700px) { .range-picker { margin-left: 0; } .range-picker button { padding: 6px 9px; font-size: 13px; } #lchart-wrap { height: 230px; } .lstats { gap: 18px; } .lstat .v { font-size: 26px; } }

  /* v382: the same "eBay · updated … · ↻" box as the Sales page */
  .title-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .title-row .page-title { margin-bottom: 0; }
  .sample-badge { font-family: 'Barlow Condensed', sans-serif; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text); border: 1px solid var(--border); background: var(--surface2); border-radius: 3px; padding: 3px 8px; cursor: pointer; }
  .sample-badge:hover { border-color: var(--accent); }
  .sample-badge:disabled { cursor: default; }
  .sample-badge .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--success); margin-right: 6px; vertical-align: 1px; }
  .sample-badge.warn .dot { background: var(--danger); }
  .sample-badge.busy .dot { background: var(--accent); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  #loading { position: fixed; inset: 0; background: var(--bg); z-index: 100; display: flex; align-items: center; justify-content: center; color: var(--muted); font-family: 'Barlow Condensed', sans-serif; letter-spacing: 2px; text-transform: uppercase; }
  #loading.hidden { display: none; }

  @media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) {
    header { padding: 0 12px; gap: 8px; }
    .who, .header-wide { display: none !important; }
    .header-right { gap: 6px; }
    .header-right .btn-sm { padding: 5px 8px; font-size: 11px; letter-spacing: 0.5px; }
    .page-tabs { margin-left: 4px; }
    .page-tabs a { padding: 5px 7px; font-size: 13px; letter-spacing: 0.5px; }
    .page-tabs { overflow-x: auto; scrollbar-width: none; flex-shrink: 1; min-width: 0; }   /* v319: 5 tabs — slide sideways if needed */
    .page-tabs a { padding: 5px 6px; font-size: 12px; flex-shrink: 0; }
    .logo { font-size: 20px; }
    main { padding: 16px 16px 40px; }
    .grid { grid-template-columns: 1fr; }
    .tile-value { font-size: 34px; }
  }
  .dr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; margin-top: 16px; }
  .dr { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; display: flex; flex-direction: column; }
  .dr-img { aspect-ratio: 4/3; background: var(--surface2); display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; overflow: hidden; }
  .dr-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .dr-body { padding: 10px 12px; flex: 1; }
  .dr-title { font-weight: 600; font-size: 14px; line-height: 1.3; word-break: break-word; }
  .dr-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .dr-price { color: var(--accent); font-weight: 700; }
  .dr-btns { display: flex; gap: 6px; padding: 0 12px 12px; flex-wrap: wrap; }
  .dr-btns .btn { flex: 1; text-align: center; justify-content: center; }
  .dr-note { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .dr-empty { color: var(--muted); padding: 40px 0; text-align: center; }
</style>
</head>
<body>
<div id="loading">Loading…</div>
<header>
  <a href="/" class="logo-link" title="Home">
    <div class="logo"><span>PARTS</span>LISTER</div>
    <div class="logo-sub">PRO <span style="font-size:9px;opacity:0.6;font-weight:400;letter-spacing:0.5px;">v422</span></div>
  </a>
  <nav class="page-tabs" aria-label="Pages">
    <a href="/">Home</a>
    <a href="/sales">Sales</a>
    <a href="/orders">Orders</a>
    <a href="/messages">Messages</a>
    <a href="/returns">Returns</a>
    <a href="/active" aria-current="page">Active</a>
    <a href="/list" title="Open the Listing Tool">Listings</a>
  </nav>
  <div class="header-right">
    <span class="who" id="who"></span>
    <a href="/sales?settings=1" class="btn btn-secondary btn-sm" title="Settings" aria-label="Settings">⚙</a>
    <button class="btn btn-secondary btn-sm header-wide" onclick="logout()">Log Out</button>
  </div>
</header>
<main>
  <div class="title-row"><div class="page-title">Drafts</div>
    <a href="/active" class="btn btn-secondary btn-sm">← Active</a>
    <a href="/list" class="btn btn-secondary btn-sm">Listing Tool</a></div>
  <div class="dr-note" id="dr-note">&nbsp;</div>
  <div class="error-box" id="dr-error" style="display:none"></div>
  <div class="dr-grid" id="dr-grid"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function logout() { await fetch('/api/logout', { method: 'POST' }).catch(() => {}); location.href = '/sales'; }
function ago(t) {
  const s = Math.max(0, (Date.now() - new Date(t).getTime()) / 1000);
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' hr ago';
  const d = Math.round(s / 86400); return d + (d === 1 ? ' day ago' : ' days ago');
}
function fail(msg) { const e = $('dr-error'); e.textContent = msg; e.style.display = 'block'; }
async function load() {
  try {
    const m = await fetch('/api/me');
    if (m.status === 401) { location.href = '/sales?next=' + encodeURIComponent(location.pathname); return; }
    if (m.ok) { const me = await m.json(); $('who').textContent = me.email + (me.isAdmin ? '  · admin' : ''); }
    const r = await fetch('/api/drafts');
    if (r.status === 404) { fail('The server is out of date — upload the newest server.js to Railway.'); return; }
    if (!r.ok) { fail('Could not load drafts (server problem ' + r.status + ').'); return; }
    render(await r.json());
  } catch (e) { fail('Could not load drafts — check your connection and reload.'); }
  finally { $('loading').classList.add('hidden'); }
}
function render(d) {
  const mb = (d.bytes || 0) / 1048576;
  $('dr-note').textContent = d.drafts.length + ' of ' + d.max + ' drafts · ' + (mb < 0.1 && d.bytes ? '<0.1' : mb.toFixed(1)) + ' MB of photos';
  const g = $('dr-grid');
  if (!d.drafts.length) { g.innerHTML = '<div class="dr-empty" style="grid-column:1/-1">No drafts yet. In the Listing Tool, press <b>Save draft</b> under Launch to eBay.</div>'; return; }
  g.innerHTML = d.drafts.map(x => {
    const meta = [x.pn, x.vehicle].filter(Boolean).map(esc).join(' · ');
    return '<div class="dr" data-id="' + x.id + '">' +
      '<div class="dr-img">' + (x.photoCount ? '<img loading="lazy" alt="" src="/api/drafts/' + x.id + '/photos/0">' : 'No photos') + '</div>' +
      '<div class="dr-body"><div class="dr-title">' + esc(x.label) + '</div>' +
      '<div class="dr-meta">' + (x.price ? '<span class="dr-price">$' + esc(String(x.price).replace(/^\$/, '')) + '</span> · ' : '') + x.photoCount + ' photo' + (x.photoCount === 1 ? '' : 's') + ' · ' + ago(x.updatedAt) + '</div>' +
      (meta ? '<div class="dr-meta">' + meta + '</div>' : '') + '</div>' +
      '<div class="dr-btns"><a class="btn btn-sm" style="background:var(--accent);color:#000" href="/list?draft=' + x.id + '">Resume</a>' +
      (x.photoCount ? '<a class="btn btn-secondary btn-sm" href="/list?draft=' + x.id + '&rescan=1" title="Load only the photos and scan them again">Rescan</a>' : '') +
      '<button class="btn btn-secondary btn-sm" onclick="del(' + x.id + ')">Delete</button></div></div>';
  }).join('');
}
async function del(id) {
  if (!confirm('Delete this draft and its photos?')) return;
  try {
    const r = await fetch('/api/drafts/' + id + '/delete', { method: 'POST' });
    if (!r.ok) throw 0;
    load();
  } catch (e) { fail('Could not delete the draft — try again.'); }
}
load();
</script>
</body>
</html>
